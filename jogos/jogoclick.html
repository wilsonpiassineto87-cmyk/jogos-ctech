<script>
const F=n=>{n=Math.floor(n);if(n>=1e12)return(n/1e12).toFixed(1)+'T';if(n>=1e9)return(n/1e9).toFixed(1)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n+''};

// ===== ÁUDIO — VOLUME 100% =====
const A={
    x:null,m:null,nb:null,dc:null,on:false,nt:0,bc:0,tid:null,tmp:116,sa:0.12,la:25,lcs:0,
    init(){
        if(this.x)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
        this.x=new C();this.m=this.x.createGain();
        this.m.gain.value=1.0;
        const c=this.x.createDynamicsCompressor();c.threshold.value=-12;c.knee.value=10;c.ratio.value=8;c.attack.value=0.003;c.release.value=0.2;
        this.m.connect(c);c.connect(this.x.destination);
        const l=this.x.sampleRate;this.nb=this.x.createBuffer(1,l,this.x.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<l;i++)d[i]=Math.random()*2-1;
        const k=250,s=11025;this.dc=new Float32Array(s);for(let i=0;i<s;i++){const v=(i*2)/s-1;this.dc[i]=(3+k)*v*20*(Math.PI/180)/(Math.PI+k*Math.abs(v))}
    },
    ens(){this.init();if(this.x&&this.x.state==='suspended')this.x.resume()},
    
    coin(){
        this.ens();if(!this.x||this.x.state!=='running')return;const t=this.x.currentTime;if(t-this.lcs<0.08)return;this.lcs=t;const c=this.x;
        [988,1319,1568].forEach((f,i)=>{
            const o=c.createOscillator();o.type=i===0?'square':'sine';o.frequency.value=f;
            const g=c.createGain();const st=t+i*0.045;
            g.gain.setValueAtTime(0.0001,st);g.gain.exponentialRampToValueAtTime(i===0?0.15:0.08,st+0.012);g.gain.exponentialRampToValueAtTime(0.001,st+0.28-i*0.04);
            o.connect(g);g.connect(this.m);o.start(st);o.stop(st+0.32)
        })
    },

    gt(f,t,d,v=0.14){
        if(!this.x)return;const c=this.x,g=c.createGain();
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+0.018);g.gain.exponentialRampToValueAtTime(v*0.35,t+d*0.45);g.gain.setTargetAtTime(0.0001,t+d*0.7,0.05);
        const ds=c.createWaveShaper();ds.curve=this.dc;
        const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(2600,t);fl.frequency.exponentialRampToValueAtTime(700,t+d);fl.Q.value=0.5;
        ds.connect(fl);fl.connect(g);g.connect(this.m);
        [-3,3].forEach(dt=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(ds);o.start(t);o.stop(t+d+0.04)})
    },
    
    pc(r,t,d,v=0.11){this.gt(r,t,d,v);this.gt(r*1.498,t,d,v*0.6);this.gt(r*2,t,d,v*0.35)},
    
    bs(f,t,d){
        if(!this.x)return;const c=this.x;
        const o=c.createOscillator();o.type='triangle';o.frequency.value=f;
        const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.2,t+0.025);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=280;fl.Q.value=0.4;
        o.connect(fl);fl.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+0.03);
        const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f/2;
        const g2=c.createGain();g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(0.12,t+0.03);g2.gain.exponentialRampToValueAtTime(0.001,t+d*0.8);
        o2.connect(g2);g2.connect(this.m);o2.start(t);o2.stop(t+d+0.03)
    },
    
    kk(t){
        if(!this.x)return;const c=this.x;
        const o=c.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(35,t+0.14);
        const g=c.createGain();g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.24);
        o.connect(g);g.connect(this.m);o.start(t);o.stop(t+0.28);
        const o2=c.createOscillator();o2.type='square';o2.frequency.value=800;
        const g2=c.createGain();g2.gain.setValueAtTime(0.08,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.02);
        o2.connect(g2);g2.connect(this.m);o2.start(t);o2.stop(t+0.03)
    },
    
    sn(t){
        if(!this.x)return;const c=this.x;
        const s=c.createBufferSource();s.buffer=this.nb;
        const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1500;f.Q.value=0.6;
        const g=c.createGain();g.gain.setValueAtTime(0.24,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
        s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+0.15);
        const o=c.createOscillator();o.type='triangle';o.frequency.value=180;
        const g2=c.createGain();g2.gain.setValueAtTime(0.1,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
        o.connect(g2);g2.connect(this.m);o.start(t);o.stop(t+0.1)
    },
    
    hh(t,o=false){
        if(!this.x)return;const c=this.x,s=c.createBufferSource();s.buffer=this.nb;
        const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
        const g=c.createGain();const d=o?0.16:0.03;
        g.gain.setValueAtTime(0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        s.connect(f);f.connect(g);g.connect(this.m);s.start(t);s.stop(t+d+0.02)
    },
    
    sl(f,t,d){
        if(!this.x)return;const c=this.x,o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;
        const lfo=c.createOscillator();lfo.frequency.value=5;lfo.type='sine';
        const lg=c.createGain();lg.gain.value=4;lfo.connect(lg);lg.connect(o.frequency);
        const ds=c.createWaveShaper();ds.curve=this.dc;
        const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(3000,t);fl.frequency.exponentialRampToValueAtTime(1000,t+d);fl.Q.value=1.5;
        const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        o.connect(ds);ds.connect(fl);fl.connect(g);g.connect(this.m);
        o.start(t);o.stop(t+d+0.03);lfo.start(t);lfo.stop(t+d+0.03)
    },
    
    pr:[82.41,65.41,98,73.42],pn:[329.63,392,440,493.88,587.33,659.25],
    sc(s,t){
        const b=Math.floor(s/16)%4,st=s%16,r=this.pr[b];
        if(st===0||st===10)this.kk(t);
        if(st===4||st===12)this.sn(t);
        if(st%2===0)this.hh(t,st===14);
        if(st===7&&b%2===1)this.kk(t);
        if(st===14&&b===3)this.sn(t);
        if(st%2===0){
            const accent=st===0||st===8;
            this.gt(r,t,accent?0.16:0.09,accent?0.14:0.07)
        }
        if(st===0)this.pc(r,t,0.65,0.09);
        if(st===0||st===8)this.bs(r,t,0.28);
        if(st===12)this.bs(r*1.498,t,0.14);
        if(b>=2&&(st===2||st===6||st===11)&&Math.random()>0.35){
            this.sl(this.pn[Math.random()*6|0],t,0.2)
        }
    },
    sk(){if(!this.x)return;while(this.nt<this.x.currentTime+this.sa){this.sc(this.bc,this.nt);this.nt+=(60/this.tmp)/4;this.bc++}if(this.on)this.tid=setTimeout(()=>this.sk(),this.la)},
    tg(){this.ens();if(!this.x)return false;if(this.on){this.on=false;clearTimeout(this.tid);return false}this.on=true;this.bc=0;this.nt=this.x.currentTime+0.08;this.sk();return true}
};

    m:0,cv:1,ai:0,lt:performance.now(),up:{},
    init(){UC.forEach(u=>this.up[u.id]=0);this.rs();this.ui();requestAnimationFrame(t=>this.pl(t))},
    gc(id){const c=UC.find(u=>u.id===id);return Math.floor(c.bc*Math.pow(c.cm,this.up[id]))},
    buy(id){const cost=this.gc(id);if(this.m>=cost){this.m-=cost;this.up[id]++;const c=UC.find(u=>u.id===id);if(c.tp==='c')this.cv+=c.v;else this.ai+=c.v;V.pe();this.ui();this.rs()}},
    pl(ct){const dt=Math.min((ct-this.lt)/1000,0.1);this.lt=ct;if(this.ai>0){this.m+=this.ai*dt;this.ui()}this.us();requestAnimationFrame(t=>this.pl(t))},
    ui(){document.getElementById('sc').innerText=F(this.m);document.getElementById('pc').innerText=F(this.cv);document.getElementById('ps').innerText=F(this.ai)},
    us(){UC.forEach(u=>{const e=document.getElementById('b-'+u.id);if(e){const ok=this.m>=this.gc(u.id);e.classList.toggle('dis',!ok);e.classList.toggle('cb',ok)}})},
    rs(){const c=document.getElementById('uc');let h='';UC.forEach(u=>{const lv=this.up[u.id],co=this.gc(u.id),af=this.m>=co;h+=`<div class="ui ${af?'cb':'dis'}" id="b-${u.id}" onclick="G.buy('${u.id}')"><div class="ic">${u.ic}</div><div class="ud"><div class="un">${u.nm}</div><div class="ds">${u.ds}</div><div class="co">💰 ${F(co)}</div></div><div class="lb">${lv}</div></div>`});c.innerHTML=h}
};

    aq(){
        this.frc++;const now=performance.now(),el=now-this.lfc;

            if(fps<35&&this.pr>this.mn){this.pr=Math.max(this.mn,this.pr-0.3);ch=true}
            else if(fps>55&&this.pr<this.mx){this.pr=Math.min(this.mx,this.pr+0.2);ch=true}
            if(ch){this.r.setPixelRatio(this.pr);this.cp.setPixelRatio(this.pr);this.r.setSize(innerWidth,innerHeight);this.cp.setSize(innerWidth,innerHeight)}
            if(fps<22&&!this.lq){this.lq=true;this.bp.enabled=false;this.r.shadowMap.enabled=false;this.s.traverse(o=>{if(o.material)o.material.needsUpdate=true})}

    scb(o,snd=true){
        if(snd)A.coin();
        const cnt=2+(Math.random()*2|0);
        for(let i=0;i<cnt;i++){
            if(this.cs.length>=this.MC){const old=this.cs.shift();this.s.remove(old.m);this.cp2.push(old.m)}
            const cm=this.gcp();cm.position.copy(o);cm.position.y+=1.5;cm.scale.setScalar(1);
            const a=Math.random()*Math.PI*2,sp=2+Math.random()*3;
            cm.userData={v:new THREE.Vector3(Math.cos(a)*sp,6+Math.random()*4,Math.sin(a)*sp),rs:new THREE.Vector3(Math.random()*10-5,Math.random()*10-5,Math.random()*10-5),lf:2};
            this.s.add(cm);this.cs.push({m:cm})
        }
    },

    pe(){if(!this.mb)return;const bt=this.mb.children[2];bt.material.emissive.setHex(0x4dff88);bt.material.emissiveIntensity=0.45;this.scb(new THREE.Vector3(0,0,0),false);setTimeout(()=>{bt.material.emissive.setHex(0x8b0000);bt.material.emissiveIntensity=0.12},150)},

    oc(e){
        if(e.target.closest('#sp')||e.target.closest('#tb')||e.target.closest('#mb'))return;
        this.ms.x=(e.clientX/innerWidth)*2-1;this.ms.y=-(e.clientY/innerHeight)*2+1;
        this.rc.setFromCamera(this.ms,this.cam);
        if(this.rc.intersectObject(this.mb,true).length>0){
            G.m+=G.cv;G.ui();
            const bt=this.mb.children[2];bt.position.y=0.9;bt.material.emissiveIntensity=0.45;
            setTimeout(()=>{bt.position.y=1.2;bt.material.emissiveIntensity=0.12},70);
            this.scb(new THREE.Vector3(0,0,0),true);
            this.ft(e.clientX,e.clientY,'+R$ '+F(G.cv))
        }
    },

    ft(x,y,t){
        const old=document.querySelectorAll('.ft');if(old.length>8)old[0].remove();
        const el=document.createElement('div');el.className='ft';el.innerText=t;el.style.left=x+'px';el.style.top=(y-20)+'px';
        document.body.appendChild(el);setTimeout(()=>el.remove(),650)
    },

    or(){this.cam.aspect=innerWidth/innerHeight;this.cam.updateProjectionMatrix();this.r.setSize(innerWidth,innerHeight);this.cp.setSize(innerWidth,innerHeight)},

    an(){
        requestAnimationFrame(()=>this.an());
        const dt=Math.min(this.ck.getDelta(),0.05),t=this.ck.getElapsedTime();
        this.aq();
        this.cam.position.x=Math.sin(t*0.12)*0.4;this.cam.position.y=6+Math.sin(t*0.08)*0.12;this.cam.lookAt(0,1.5,0);
        if(this.mb)this.mb.rotation.y+=dt*0.15;
        if(this.er){
            this.er.scale.setScalar(1+Math.sin(t*2.5)*0.04);this.er.rotation.z+=dt*0.4;
            const hue=(t*0.08)%1;this.tmpC.setHSL(hue,1,0.45);
            this.er.material.color.copy(this.tmpC);this.er.material.emissive.copy(this.tmpC);this.er.material.emissiveIntensity=0.6
        }
        this.strips.forEach(st=>{
            this.tmpC.setHSL((t*0.04+st.off)%1,1,0.42);
            st.m.color.copy(this.tmpC);st.m.emissive.copy(this.tmpC);st.m.emissiveIntensity=0.6
        });
        this.orb.forEach(o=>{
            const a=t*o.sp+o.off;o.l.position.set(Math.cos(a)*o.r,4,Math.sin(a)*o.r);
            this.tmpC.setHSL((t*0.1+o.off)%1,1,0.4);o.l.color.copy(this.tmpC)
        });
        this.spheres.forEach(s=>{s.s.position.y=s.by+Math.sin(t*s.sp2)*0.15;s.s.rotation.y+=dt*2;s.r.rotation.x+=dt*1.5;s.r.rotation.y+=dt});
        if(this.fc){this.fc.rotation.y+=dt*1.5;this.fc.position.y=4.5+Math.sin(t*1.8)*0.2}
        this.nl.forEach((n,i)=>{n.l.intensity=n.b+Math.sin(t*n.s+i)*(n.b*0.08)});
        this.fr.forEach(item=>{item.m.position.y=item.by+Math.sin(t*item.sp+item.of)*0.18;item.m.rotation.z+=dt*item.sp});
        for(let i=this.cs.length-1;i>=0;i--){
            const m=this.cs[i].m,u=m.userData;u.v.y-=15*dt;m.position.addScaledVector(u.v,dt);
            m.rotation.x+=u.rs.x*dt;m.rotation.y+=u.rs.y*dt;m.rotation.z+=u.rs.z*dt;
            if(m.position.y<0.1&&u.v.y<0){m.position.y=0.1;u.v.y*=-0.5;u.v.x*=0.7;u.v.z*=0.7}
            u.lf-=dt;if(u.lf<0.5)m.scale.setScalar(Math.max(u.lf/0.5,0.01));
            if(u.lf<=0){this.s.remove(m);m.scale.setScalar(1);this.cp2.push(m);this.cs.splice(i,1)}
        }
        this.cp.render()
    }
};

onload=()=>{V.init();G.init();HC()};
</script>
