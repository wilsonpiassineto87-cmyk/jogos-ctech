<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><style id="tc-overflow-guard">html,body{max-width:100vw;overflow-x:hidden}</style></head><body>

<title>Aventura Saltitante</title>
<style>
  :root{
    --ui-bg: rgba(20,20,30,0.55);
    --ui-text:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #stage{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  #game{
    touch-action:none;
    max-width:100%;max-height:100%;
    image-rendering:pixelated;
  }
  #hud{
    position:absolute;top:12px;left:12px;right:12px;
    background:var(--ui-bg);color:var(--ui-text);
    padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;
    pointer-events:none;
    max-width:calc(100% - 24px);
  }
  #hud > span{white-space:nowrap;}
  #muteBtn{
    pointer-events:auto;background:none;border:none;color:#fff;
    font-size:16px;cursor:pointer;padding:0 2px;margin-left:auto;
  }
  #hint{
    position:absolute;top:56px;right:12px;
    background:var(--ui-bg);color:var(--ui-text);
    padding:8px 14px;border-radius:10px;font-size:13px;max-width:220px;
    pointer-events:none;
  }
  #hint .touch-only{display:none;}
  body.is-touch #hint .desktop-only{display:none;}
  body.is-touch #hint .touch-only{display:block;}

  #controls{
    position:absolute;bottom:0;left:0;right:0;
    display:none;
    justify-content:space-between;
    padding:18px;pointer-events:none;
  }
  body.is-touch #controls{display:flex;}
  .dpad{display:flex;gap:14px;pointer-events:auto;}
  .btn{
    width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,0.28);
    border:2px solid rgba(255,255,255,0.6);
    color:#fff;font-size:26px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
  }
  .btn:active{background:rgba(255,255,255,0.5);}
  #jumpBtn{width:76px;height:76px;align-self:flex-end;pointer-events:auto;
    border-radius:50%;background:rgba(255,210,60,0.35);
    border:2px solid rgba(255,210,60,0.8);color:#fff;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;user-select:none;}
  #jumpBtn:active{background:rgba(255,210,60,0.6);}

  #overlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(10,10,20,0.68);
    color:#fff;text-align:center;
  }
  #overlay.show{display:flex;}
  #overlayBox{background:rgba(20,20,30,0.92);padding:28px 32px;border-radius:16px;max-width:380px;}
  #overlayBox h2{margin:0 0 10px;font-size:24px;}
  #overlayBox p{margin:0 0 18px;opacity:0.88;font-size:14px;line-height:1.5;}
  #restartBtn{
    background:#ffcb3d;border:none;color:#3a2600;font-weight:700;
    padding:10px 24px;border-radius:10px;font-size:15px;cursor:pointer;
  }
  #restartBtn:active{transform:scale(0.97);}

  #charOverlay{
    position:absolute;inset:0;display:none;
    align-items:center;justify-content:center;
    background:rgba(10,10,20,0.75);
    color:#fff;text-align:center;z-index:5;
  }
  #charOverlay.show{display:flex;}
  #charBox{background:rgba(20,20,30,0.92);padding:26px 30px;border-radius:16px;max-width:520px;}
  #charBox h2{margin:0 0 18px;font-size:22px;}
  #charCards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
  .charCard{
    background:rgba(255,255,255,0.08);border:2px solid transparent;border-radius:12px;
    padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .15s, border-color .15s;width:120px;
  }
  .charCard:hover{transform:translateY(-4px);border-color:#ffcb3d;}
  .charCard img{width:64px;height:64px;image-rendering:pixelated;}
  .charCard span{font-size:13px;font-weight:600;}
</style>

<div id="stage">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="hud">
    <span>🌍 Fase <span id="levelNum">1</span>/<span id="levelTotal">7</span></span>
    <span>🪙 <span id="coinCount">0</span>/<span id="coinTotal">0</span></span>
    <span>💥 <span id="stompCount">0</span></span>
    <span>❤️ <span id="livesCount">3</span></span>
    <button id="muteBtn" title="Ligar/desligar som">🔊</button>
  </div>

  <div id="hint">
    <span class="desktop-only">Setas / A-D para mover, Espaço ou ↑ para pular (segure menos para pulos curtos)</span>
    <span class="touch-only">Use os botões para mover e pular</span>
  </div>

  <div id="controls">
    <div class="dpad">
      <div class="btn" id="leftBtn">◀</div>
      <div class="btn" id="rightBtn">▶</div>
    </div>
    <div id="jumpBtn">PULAR</div>
  </div>

  <div id="overlay">
    <div id="overlayBox">
      <h2 id="overlayTitle">Aventura Saltitante</h2>
      <p id="overlayText">Carregando...</p>
      <button id="restartBtn">Começar</button>
    </div>
  </div>

  <div id="charOverlay">
    <div id="charBox">
      <h2>Escolha seu personagem</h2>
      <div id="charCards">
        <div class="charCard" data-char="0">
          <img alt="Herói Azul">
          <span>Herói Azul</span>
        </div>
        <div class="charCard" data-char="1">
          <img alt="Herói Verde">
          <span>Herói Verde</span>
        </div>
        <div class="charCard" data-char="2">
          <img alt="Heroína Roxa">
          <span>Heroína Roxa</span>
        </div>
      </div>
    </div>
  </div>
</div>

  function ensureAudio(){
    if (!audioCtx){

    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  }

  function tone(freq, duration, type, vol, delay, glideTo){
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(glideTo,1), t0 + duration);
    gain.gain.setValueAtTime(vol != null ? vol : 0.14, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  // ================= GERAÇÃO PROCEDURAL DAS FASES =================
  // Cada fase é gerada a partir de parâmetros de dificuldade, garantindo que

  var LEVEL_CONFIGS = [

  // Fases com chefão (índices 0-based): Caverna Escura, Deserto Esquecido, Torre Final
  var BOSS_LEVELS = [2, 4, 6];

  var HEIGHT_PATTERN = [110,190,60,180,260,150,90,200,130,170,220,80];
  var WIDTH_PATTERN = [110,130,150,120,140,160,110,140];

  var LEVEL_WIDTH, platforms, gaps, coins, flag, enemies, fireBars, boss;

  function generateLevel(idx){
    var cfg = LEVEL_CONFIGS[idx];
    LEVEL_WIDTH = cfg.levelWidth;

    var spacing = Math.floor((LEVEL_WIDTH - 500) / cfg.platformCount);
    var movingSet = {};
    for (var m=0;m<cfg.movingCount;m++){
      var pick = Math.floor((m+1) * cfg.platformCount / (cfg.movingCount+1));
      movingSet[pick] = true;
    }

    var plats = [];
    for (var i=0;i<cfg.platformCount;i++){
      var x = 300 + i*spacing;
      var h = HEIGHT_PATTERN[i % HEIGHT_PATTERN.length];
      var w = WIDTH_PATTERN[i % WIDTH_PATTERN.length];
      var plat = {x:x, y:GROUND_Y-h, w:w, h:24};
      if (movingSet[i]){
        var range = 160 + idx*10;
        plat.move = {min:x, max:x+range, speed: 1.4 + idx*0.15, dir:1};
      }
      plats.push(plat);
    }

    var gapsArr = [];
    var gapZoneStart = 600, gapZoneEnd = LEVEL_WIDTH - 400;
    var gapSpacing = (gapZoneEnd - gapZoneStart) / (cfg.gapCount + 1);
    for (var g=1; g<=cfg.gapCount; g++){
      gapsArr.push({x: Math.round(gapZoneStart + g*gapSpacing), w:90});
    }

    var coinsArr = plats.map(function(p){
      return {x: p.x + p.w/2, y: p.y - 34, collected:false};
    });

    var flagObj = {x: LEVEL_WIDTH - 100, w:14, h:160};

    var sortedGaps = gapsArr.slice().sort(function(a,b){return a.x-b.x;});
    var segments = [];
    var cursor = 40;
    sortedGaps.forEach(function(gp){
      if (gp.x - cursor > 160) segments.push([cursor, gp.x - 20]);
      cursor = gp.x + gp.w + 20;
    });
    if (LEVEL_WIDTH - 160 - cursor > 160) segments.push([cursor, LEVEL_WIDTH-160]);
    if (segments.length === 0) segments.push([200, LEVEL_WIDTH-300]);

    var enemiesArr = [];
    for (var e=0; e<cfg.enemyCount; e++){
      var seg = segments[e % segments.length];
      var segW = seg[1]-seg[0];
      var patrolW = Math.min(180, Math.max(80, segW-40));
      var startX = seg[0] + Math.max(0,(segW-patrolW)/2);
      var speed = cfg.enemySpeedMin + (cfg.enemySpeedMax-cfg.enemySpeedMin) * (cfg.enemyCount>1 ? e/(cfg.enemyCount-1) : 0);
      var type = (idx >= 2 && (e % 2 === 1)) ? 1 : 0; // tipo 1 = variante mais dura (vermelha)
      var hp = type === 1 ? 2 : 1;
      enemiesArr.push({ x:startX, minX:startX, maxX:startX+patrolW, y:GROUND_Y-26, w:28, h:26, vx:speed, alive:true, squished:false, squishTimer:0, type:type, hp:hp, maxHp:hp });
    }

    // Chefão (boss): aparece perto do fim de algumas fases e bloqueia a bandeira
    // até ser derrotado com 3 pulos na cabeça (mais pulos nas fases mais difíceis).
    var bossObj = null;
    if (BOSS_LEVELS.indexOf(idx) !== -1){
      var bw = 90, bh = 86;
      var bMinX = LEVEL_WIDTH - 480;
      var bMaxX = LEVEL_WIDTH - 200;
      var bHp = 3 + BOSS_LEVELS.indexOf(idx);
      bossObj = {
        x: bMinX, y: GROUND_Y - bh, w: bw, h: bh,
        minX: bMinX, maxX: bMaxX,
        vx: 1.6 + idx*0.15,
        hp: bHp, maxHp: bHp,
        invuln: 0, alive: true, defeated: false
      };
    }

    // Fire bars (obstáculo clássico de castelo: um "cabo" de bolas de fogo
    // girando em torno de um ponto fixo, como nas fases de castelo do Mario).
    var fireBarsArr = [];
    var fbCount = cfg.fireBarCount || 0;
    for (var fb=0; fb<fbCount; fb++){
      var frac = (fb+1) / (fbCount+1);
      var fx = 500 + frac * (LEVEL_WIDTH - 900);
      fireBarsArr.push({
        anchorX: fx, anchorY: GROUND_Y - 100,
        angle: Math.random()*Math.PI*2,
        speed: 0.03 + idx*0.004,
        dir: (fb % 2 === 0) ? 1 : -1,
        ballCount: 4, spacing: 20
      });
    }

    platforms = plats;
    gaps = gapsArr;
    coins = coinsArr;
    flag = {x:flagObj.x, y: GROUND_Y - flagObj.h, w:flagObj.w, h:flagObj.h};
    enemies = enemiesArr;
    fireBars = fireBarsArr;
    boss = bossObj;
  }

        vy:-Math.random() * (upSpeed||3) - 1,
        life:1, size: 3 + Math.random()*3,
        color: color
      });

  function updateParticles(){
    for (var i=particles.length-1;i>=0;i--){
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.18;
      p.life -= 0.035;
      if (p.life <= 0) particles.splice(i,1);
    }
  }

  }
  function updateCoinHud(){
    document.getElementById('coinTotal').textContent = coins.length;
    var got = coins.filter(function(c){return c.collected;}).length;
    document.getElementById('coinCount').textContent = got;
  }
  function updateStompHud(){ document.getElementById('stompCount').textContent = totalStomps; }
  function updateLivesHud(){ document.getElementById('livesCount').textContent = lives; }

  function showOverlay(title, text, btnText, onConfirm){
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlayText').textContent = text;
    document.getElementById('restartBtn').textContent = btnText;
    document.getElementById('overlay').classList.add('show');
    pendingConfirm = onConfirm;
  }
  function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }

  document.getElementById('restartBtn').addEventListener('click', function(){
    ensureAudio();
    var cb = pendingConfirm;
    pendingConfirm = null;
    if (cb) cb();
  });

  function showLevelIntroCard(idx){
    gameState = 'intro';
    currentLevelIndex = idx;
    currentTheme = THEMES[idx];
    updateHudTheme();
    introShown[idx] = true;
    showOverlay('Fase ' + (idx+1) + ': ' + currentTheme.name, currentTheme.mission, 'Vamos lá!', function(){
      actuallyStartLevel(idx);
    });
  }

  function actuallyStartLevel(idx){
    currentLevelIndex = idx;
    currentTheme = THEMES[idx];
    generateLevel(idx);
    setupAmbient(currentTheme.decor);
    player.x = 60; player.y = GROUND_Y-40;
    player.vx = 0; player.vy = 0;
    player.onGround = false; player.coyote = 0;
    player.standingPlatform = null;
    camera.x = 0;
    particles = [];
    updateHudTheme();
    updateCoinHud();
    updateStompHud();
    updateLivesHud();
    hideOverlay();
    gameState = 'playing';
  }

  function goToLevel(idx, forceIntro){
    if (forceIntro || !introShown[idx]) showLevelIntroCard(idx);
    else actuallyStartLevel(idx);
  }

  function showIntroScreen(){
    gameState = 'intro';
    showOverlay(
      'Aventura Saltitante 🎮🌍',
      'Uma jornada por ' + THEMES.length + ' mundos diferentes te espera! Colete moedas, derrote inimigos pulando neles, enfrente chefões e chegue à bandeira em cada fase. Você tem 3 vidas ❤️ — use-as com sabedoria. Boa sorte, aventureiro!',
      'Começar aventura!',
      function(){ showCharSelect(); }
    );
  }

  function showCharSelect(){
    gameState = 'intro';
    hideOverlay();
    document.getElementById('charOverlay').classList.add('show');
  }

  function pickCharacter(idx){
    selectedCharacter = idx;
    document.getElementById('charOverlay').classList.remove('show');
    goToLevel(0);
  }

  function restartWholeGame(){
    lives = 3; totalStomps = 0; totalCoinsAll = 0;
    introShown = [];
    updateLivesHud();
    updateStompHud();
    showCharSelect();
  }

  // ================= ENTRADA =================
  var input = {left:false, right:false, jump:false, jumpPressed:false};

  window.addEventListener('keydown', function(e){
    ensureAudio();
    if (['ArrowLeft','a','A'].indexOf(e.key) !== -1) input.left = true;
    if (['ArrowRight','d','D'].indexOf(e.key) !== -1) input.right = true;
    if ([' ','ArrowUp','w','W'].indexOf(e.key) !== -1){
      if (!input.jump) input.jumpPressed = true;
      input.jump = true;
      e.preventDefault();
    }
  });
  window.addEventListener('keyup', function(e){
    if (['ArrowLeft','a','A'].indexOf(e.key) !== -1) input.left = false;
    if (['ArrowRight','d','D'].indexOf(e.key) !== -1) input.right = false;
    if ([' ','ArrowUp','w','W'].indexOf(e.key) !== -1) input.jump = false;
  });

  function bindHold(el, onDown, onUp){
    el.addEventListener('touchstart', function(e){ e.preventDefault(); ensureAudio(); onDown(); }, {passive:false});
    el.addEventListener('touchend',   function(e){ e.preventDefault(); onUp(); }, {passive:false});
    el.addEventListener('mousedown', function(e){ e.preventDefault(); ensureAudio(); onDown(); });
    el.addEventListener('mouseup',   function(e){ e.preventDefault(); onUp(); });
    el.addEventListener('mouseleave', function(){ onUp(); });
  }
  bindHold(document.getElementById('leftBtn'), function(){ input.left = true; }, function(){ input.left = false; });
  bindHold(document.getElementById('rightBtn'), function(){ input.right = true; }, function(){ input.right = false; });
  bindHold(document.getElementById('jumpBtn'),
    function(){ if(!input.jump) input.jumpPressed = true; input.jump = true; },
    function(){ input.jump = false; });

  // ================= COLISÃO =================
  function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh){
    return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
  }
  function isOverGap(x, w){
    for (var i=0;i<gaps.length;i++){
      var g = gaps[i];
      if (x + w > g.x && x < g.x + g.w) return true;
    }
    return false;
  }

  function loseGame(text){
    if (gameState !== 'playing') return;
    lives--;
    updateLivesHud();
    triggerShake(8, 18);
    spawnParticles(player.x+player.w/2, player.y+player.h/2, 14, '#e05a4e', 4, 5);

    if (lives <= 0){
      gameState = 'gameover';
      sfxGameOver();
      showOverlay(
        'Fim de jogo! 💀',
        'Você chegou até a Fase ' + (currentLevelIndex+1) + ' (' + currentTheme.name + '). ' + text,
        'Recomeçar do início',
        function(){ restartWholeGame(); }
      );
    } else {
      gameState = 'lost';
      sfxLoseLife();
      showOverlay(
        'Você perdeu uma vida! ❤️ x' + lives,
        text,
        'Tentar de novo',
        function(){ goToLevel(currentLevelIndex); }
      );
    }
  }

  // ================= LOOP PRINCIPAL =================
  function update(){
    if (shakeTime > 0) shakeTime--;
    updateParticles();

    if (gameState !== 'playing') return;

    platforms.forEach(function(p){
      if (!p.move) { p.deltaX = 0; return; }
      var before = p.x;
      p.x += p.move.speed * p.move.dir;
      if (p.x <= p.move.min){ p.x = p.move.min; p.move.dir = 1; }
      if (p.x >= p.move.max){ p.x = p.move.max; p.move.dir = -1; }
      p.deltaX = p.x - before;
    });

    if (player.standingPlatform && player.standingPlatform.move){
      player.x += player.standingPlatform.deltaX;
    }

    var accel = currentTheme.icy ? ICE_ACCEL : ACCEL;
    var friction = currentTheme.icy ? ICE_FRICTION : FRICTION;
    if (input.left){ player.vx -= accel; player.facing = -1; }
    else if (input.right){ player.vx += accel; player.facing = 1; }
    else { player.vx *= friction; if (Math.abs(player.vx) < 0.05) player.vx = 0; }

    if (player.vx > MAX_SPEED) player.vx = MAX_SPEED;
    if (player.vx < -MAX_SPEED) player.vx = -MAX_SPEED;

    if (player.onGround) player.coyote = COYOTE_FRAMES;
    else if (player.coyote > 0) player.coyote--;

    if (input.jumpPressed && player.coyote > 0){
      player.vy = JUMP_FORCE;
      player.onGround = false;
      player.coyote = 0;
      player.standingPlatform = null;
      sfxJump();
      spawnParticles(player.x+player.w/2, player.y+player.h, 6, 'rgba(255,255,255,0.7)', 2, 1.5);
    }
    input.jumpPressed = false;

    if (!input.jump && player.vy < JUMP_FORCE * JUMP_CUT){
      player.vy = JUMP_FORCE * JUMP_CUT;
    }

    player.vy += GRAVITY;
    if (player.vy > 20) player.vy = 20;

    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x > LEVEL_WIDTH - player.w) player.x = LEVEL_WIDTH - player.w;

    player.y += player.vy;
    player.wasOnGround = player.onGround;
    var prevVy = player.vy;
    player.onGround = false;
    player.standingPlatform = null;

    var overGap = isOverGap(player.x, player.w);
    if (!overGap && player.y + player.h >= GROUND_Y){
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    }

    for (var i=0;i<platforms.length;i++){
      var p = platforms[i];
      var wasAbove = (player.y + player.h - prevVy) <= p.y + 1;
      if (rectsOverlap(player.x, player.y, player.w, player.h, p.x, p.y, p.w, p.h)){
        if (prevVy >= 0 && wasAbove){
          player.y = p.y - player.h;
          player.vy = 0;
          player.onGround = true;
          player.standingPlatform = p;
        }
      }
    }

    if (!player.wasOnGround && player.onGround && prevVy > 4){
      spawnParticles(player.x+player.w/2, player.y+player.h, 8, 'rgba(200,180,140,0.8)', 3, 2);
    }

    if (player.y > H + 100){
      loseGame('Você caiu em um buraco. Cuidado com o caminho!');
      return;
    }

    enemies.forEach(function(en){
      if (!en.alive) return;

      if (en.squished){
        en.squishTimer--;
        if (en.squishTimer <= 0) en.alive = false;
        return;
      }

      en.x += en.vx;
      if (en.x <= en.minX){ en.x = en.minX; en.vx = Math.abs(en.vx); }
      if (en.x + en.w >= en.maxX){ en.x = en.maxX - en.w; en.vx = -Math.abs(en.vx); }

      if (rectsOverlap(player.x, player.y, player.w, player.h, en.x, en.y, en.w, en.h)){
        var playerBottom = player.y + player.h;
        var wasAboveEnemy = (playerBottom - player.vy) <= en.y + 10;
        if (player.vy > 0 && wasAboveEnemy){
          en.hp--;
          player.vy = JUMP_FORCE * 0.55;
          if (en.hp <= 0){
            en.squished = true;
            en.squishTimer = 20;
            totalStomps++;
            sfxStomp();
            triggerShake(5, 10);
            spawnParticles(en.x+en.w/2, en.y+en.h/2, 10, en.type === 1 ? '#c93c37' : '#5aa83f', 4, 4);
            updateStompHud();
          } else {
            sfxStomp();
            triggerShake(3, 6);
            spawnParticles(en.x+en.w/2, en.y+en.h/2, 6, '#ffb020', 3, 3);
          }
        } else {
          loseGame('Um inimigo te pegou! Tente pular por cima dele.');
        }
      }
    });
    if (gameState !== 'playing') return;

    if (boss && boss.alive){
      boss.x += boss.vx;
      if (boss.x <= boss.minX){ boss.x = boss.minX; boss.vx = Math.abs(boss.vx); }
      if (boss.x + boss.w >= boss.maxX){ boss.x = boss.maxX - boss.w; boss.vx = -Math.abs(boss.vx); }
      if (boss.invuln > 0) boss.invuln--;

      if (rectsOverlap(player.x, player.y, player.w, player.h, boss.x, boss.y, boss.w, boss.h)){
        var playerBottom2 = player.y + player.h;
        var wasAboveBoss = (playerBottom2 - player.vy) <= boss.y + 14;
        if (player.vy > 0 && wasAboveBoss && boss.invuln <= 0){
          boss.hp--;
          boss.invuln = 40;
          player.vy = JUMP_FORCE * 0.6;
          sfxBossHit();
          triggerShake(6, 12);
          spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, 12, '#e050d0', 5, 4);
          if (boss.hp <= 0){
            boss.alive = false;
            boss.defeated = true;
            sfxBossDefeat();
            triggerShake(14, 26);
            spawnParticles(boss.x+boss.w/2, boss.y+boss.h/2, 30, '#ffcb3d', 7, 6);
          }
        } else if (boss.invuln <= 0){
          loseGame('O chefão te pegou! Pule na cabeça dele para causar dano.');
        }
      }
    }
    if (gameState !== 'playing') return;

    fireBars.forEach(function(fb){
      fb.angle += fb.speed * fb.dir;
      for (var k=1; k<=fb.ballCount; k++){
        var dist = k * fb.spacing;
        var bx = fb.anchorX + Math.cos(fb.angle) * dist;
        var by = fb.anchorY + Math.sin(fb.angle) * dist;
        var dx = (player.x+player.w/2) - bx;
        var dy = (player.y+player.h/2) - by;
        if (Math.sqrt(dx*dx+dy*dy) < 22){
          loseGame('Uma bola de fogo te pegou! Cronometre o pulo com cuidado.');
        }
      }
    });
    if (gameState !== 'playing') return;

    coins.forEach(function(c){
      if (!c.collected && rectsOverlap(player.x, player.y, player.w, player.h, c.x-10, c.y-10, 20, 20)){
        c.collected = true;
        totalCoinsAll++;
        sfxCoin();
        spawnParticles(c.x, c.y, 8, '#ffd23d', 3, 3);
        updateCoinHud();
      }
    });

    var bossBlocking = boss && boss.alive;
    if (!bossBlocking && rectsOverlap(player.x, player.y, player.w, player.h, flag.x-10, flag.y, flag.w+20, flag.h)){
      var got = coins.filter(function(c){return c.collected;}).length;
      if (currentLevelIndex < THEMES.length - 1){
        gameState = 'levelComplete';
        sfxLevelComplete();
        showOverlay(
          'Fase ' + (currentLevelIndex+1) + ' concluída! 🏁',
          'Você pegou ' + got + '/' + coins.length + ' moedas em ' + currentTheme.name + '.',
          'Próxima fase',
          function(){ goToLevel(currentLevelIndex + 1); }
        );
      } else {
        gameState = 'finalWin';
        sfxFinalWin();
        showOverlay(
          'Você venceu o jogo! 🏆🎉',
          'Completou as ' + THEMES.length + ' fases! Moedas no total: ' + totalCoinsAll + '. Inimigos derrotados: ' + totalStomps + '.',
          'Jogar novamente',
          function(){ restartWholeGame(); }
        );
      }
    }

    camera.x = player.x - W/2 + player.w/2;
    if (camera.x < 0) camera.x = 0;
    if (camera.x > LEVEL_WIDTH - W) camera.x = LEVEL_WIDTH - W;
  }

  // ================= DESENHO =================
  function shadeColor(hex, amt){
    var num = parseInt(hex.slice(1), 16);
    var r = Math.max(0, Math.min(255, (num>>16) + amt));
    var g = Math.max(0, Math.min(255, ((num>>8)&0xff) + amt));
    var b = Math.max(0, Math.min(255, (num&0xff) + amt));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function drawGroundShadow(sx, footY, width){
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath();
    ctx.ellipse(sx, footY, width, width*0.32, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCloud(x,y,scale){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);
    ctx.fillStyle = 'rgba(160,190,215,0.28)';
    ctx.beginPath();
    ctx.arc(2,5,20,0,Math.PI*2);
    ctx.arc(24,-3,16,0,Math.PI*2);
    ctx.arc(42,5,20,0,Math.PI*2);
    ctx.arc(22,15,22,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(0,0,20,0,Math.PI*2);
    ctx.arc(22,-8,16,0,Math.PI*2);
    ctx.arc(40,0,20,0,Math.PI*2);
    ctx.arc(20,10,22,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath();
    ctx.arc(-6,-6,8,0,Math.PI*2);
    ctx.arc(16,-15,7,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawTree(x, baseY){
    ctx.fillStyle = '#241a10';
    ctx.fillRect(x-5, baseY-22, 10, 22);
    ctx.fillStyle = '#4a3420';
    ctx.fillRect(x-5, baseY-22, 4, 22);
    var hill = currentTheme.hill;
    ctx.fillStyle = shadeColor(hill, -22);
    ctx.beginPath();
    ctx.arc(x-16, baseY-56, 22, 0, Math.PI*2);
    ctx.arc(x+16, baseY-58, 20, 0, Math.PI*2);
    ctx.arc(x, baseY-86, 24, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = hill;
    ctx.beginPath();
    ctx.arc(x-13, baseY-60, 19, 0, Math.PI*2);
    ctx.arc(x+12, baseY-63, 17, 0, Math.PI*2);
    ctx.arc(x, baseY-92, 21, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.beginPath();
    ctx.arc(x-5, baseY-98, 9, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCactus(x, baseY){
    var base = '#4c7d3a', dark = shadeColor(base,-28), light = shadeColor(base,20);
    ctx.fillStyle = dark;
    ctx.fillRect(x-7, baseY-61, 14, 61);
    ctx.fillStyle = base;
    ctx.fillRect(x-6, baseY-60, 12, 60);
    ctx.fillStyle = light;
    ctx.fillRect(x-6, baseY-60, 3, 60);
    ctx.fillStyle = dark;
    ctx.fillRect(x-2, baseY-58, 1, 56);
    ctx.fillRect(x+1, baseY-58, 1, 56);
    ctx.fillStyle = base;
    ctx.fillRect(x-18, baseY-40, 12, 10);
    ctx.fillRect(x-18, baseY-50, 8, 20);
    ctx.fillRect(x+6, baseY-32, 12, 10);
    ctx.fillRect(x+14, baseY-42, 8, 20);
    ctx.fillStyle = light;
    ctx.fillRect(x-18, baseY-50, 2, 20);
    ctx.fillRect(x+14, baseY-42, 2, 20);
  }

  function drawCastleTower(x, baseY){
    var base = currentTheme.hill, dark = shadeColor(base,-25), light = shadeColor(base,16);
    ctx.fillStyle = dark;
    ctx.fillRect(x, baseY-140, 40, 140);
    ctx.fillStyle = base;
    ctx.fillRect(x+4, baseY-140, 32, 140);
    ctx.fillStyle = light;
    ctx.fillRect(x+4, baseY-140, 5, 140);
    ctx.fillStyle = 'rgba(15,12,10,0.75)';
    for (var wy = baseY-112; wy < baseY-24; wy += 36){
      ctx.fillRect(x+16, wy, 8, 14);
    }
    for (var i=0;i<3;i++){
      ctx.fillStyle = dark;
      ctx.fillRect(x + i*14, baseY-152, 10, 14);
      ctx.fillStyle = base;
      ctx.fillRect(x + i*14 + 2, baseY-150, 6, 10);
    }
  }

  function drawTorch(x, y, t){
    var flick = 0.7 + Math.sin(t/90 + x) * 0.15 + Math.random()*0.08;
    var grad = ctx.createRadialGradient(x, y, 2, x, y, 46*flick);
    grad.addColorStop(0, 'rgba(255,200,90,0.85)');
    grad.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, 46*flick, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#3a2a18';
    ctx.fillRect(x-3, y, 6, 30);
  }

  function drawBackground(t){
    var th = currentTheme;
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, th.skyTop);
    grad.addColorStop(1, th.skyBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    var parallax = camera.x * 0.3;

    if (th.decor === 'clouds'){
      for (var i=0;i<8;i++){
        var cx = (i * 420 - parallax % 3360);
        drawCloud(((cx % 3360) + 3360) % 3360 - 200, 60 + (i%3)*40, 1);
      }
      drawHills(th.hill);
    } else if (th.decor === 'trees'){
      for (var i2=0;i2<10;i2++){
        var tx = i2*380 - (camera.x*0.5)%380;
        drawTree(tx, GROUND_Y+10);
      }
    } else if (th.decor === 'torches'){
      for (var i3=0;i3<12;i3++){
        var wx = 200 + i3*260;
        var sx3 = wx - camera.x*0.85;
        if (sx3 > -60 && sx3 < W+60) drawTorch(sx3, GROUND_Y-170, t);
      }
    } else if (th.decor === 'snow'){
      drawHills(th.hill);
      ambientParticles.forEach(function(p){
        p.y += p.vy;
        if (p.y > H){ p.y = -5; p.x = Math.random()*W; }
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
    } else if (th.decor === 'desert'){
      ctx.fillStyle = 'rgba(255,240,190,0.9)';
      ctx.beginPath(); ctx.arc(W/2, 80, 46, 0, Math.PI*2); ctx.fill();
      for (var i4=0;i4<8;i4++){
        var dx = i4*340 - (camera.x*0.5)%340;
        drawCactus(dx, GROUND_Y+10);
      }
    } else if (th.decor === 'castle'){
      for (var i5=0;i5<7;i5++){
        var cxw = i5*460 - (camera.x*0.4)%460;
        drawCastleTower(cxw, GROUND_Y+10);
      }
    } else if (th.decor === 'stars'){
      ambientParticles.forEach(function(p){
        var alpha = 0.5 + Math.sin(t/300 + p.tw) * 0.5;
        ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.fillStyle = 'rgba(230,230,255,0.9)';
      ctx.beginPath(); ctx.arc(W/2, 75, 34, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawHills(color){
    // camada de montanhas distantes (parallax mais lento) para dar profundidade
    ctx.fillStyle = shadeColor(color, 26);
    for (var m=0; m<5; m++){
      var mx = m*820 - (camera.x*0.22)%820;
      ctx.beginPath();
      ctx.moveTo(mx-150, GROUND_Y+30);
      ctx.lineTo(mx-30, GROUND_Y-70);
      ctx.lineTo(mx+30, GROUND_Y-40);
      ctx.lineTo(mx+150, GROUND_Y+30);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = color;
    for (var h=0; h<6; h++){
      var hx = h*700 - (camera.x*0.5)%700;
      ctx.beginPath();
      ctx.ellipse(hx, GROUND_Y+40, 260, 90, 0, Math.PI, 0, true);
      ctx.fill();
    }
  }

  function drawGround(){
    var th = currentTheme;
    var sorted = gaps.slice().sort(function(a,b){return a.x-b.x;});
    var cursor = 0;
    sorted.forEach(function(g){
      drawGroundSeg(cursor, g.x - cursor, th);
      if (th.lava) drawLavaGap(g.x, g.w);
      cursor = g.x + g.w;
    });
    drawGroundSeg(cursor, LEVEL_WIDTH - cursor, th);
  }

  function drawLavaGap(x, w){
    var sx = x - camera.x;
    if (sx + w < 0 || sx > W) return;
    var grad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    grad.addColorStop(0, '#ff8a3d');
    grad.addColorStop(1, '#8a1a00');
    ctx.fillStyle = grad;
    ctx.fillRect(sx, GROUND_Y+8, w, H-GROUND_Y-8);
    var t = Date.now();
    for (var b=0;b<3;b++){
      var bx = sx + w*(0.2+b*0.3);
      var by = GROUND_Y + 16 + Math.sin(t/220 + b*2)*4;
      ctx.fillStyle = 'rgba(255,210,120,0.85)';
      ctx.beginPath(); ctx.arc(bx, by, 4, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawFireBars(){
    fireBars.forEach(function(fb){
      var ax = fb.anchorX - camera.x;
      if (ax < -100 || ax > W+100) return;
      var endX = ax + Math.cos(fb.angle) * fb.ballCount * fb.spacing;
      var endY = fb.anchorY + Math.sin(fb.angle) * fb.ballCount * fb.spacing;
      ctx.strokeStyle = '#3a3a3a';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(ax, fb.anchorY); ctx.lineTo(endX, endY); ctx.stroke();
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(ax, fb.anchorY, 7, 0, Math.PI*2); ctx.fill();
      for (var k=1;k<=fb.ballCount;k++){
        var dist = k*fb.spacing;
        var bx = ax + Math.cos(fb.angle)*dist;
        var by = fb.anchorY + Math.sin(fb.angle)*dist;
        var grad = ctx.createRadialGradient(bx,by,1,bx,by,10);
        grad.addColorStop(0,'#fff3c4');
        grad.addColorStop(0.5,'#ff9a3c');
        grad.addColorStop(1,'rgba(255,60,0,0.2)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(bx,by,10,0,Math.PI*2); ctx.fill();
      }
    });
  }
  function drawGroundSeg(x, w, th){
    if (w <= 0) return;
    var sx = x - camera.x;
    var grad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    grad.addColorStop(0, th.groundBody);
    grad.addColorStop(1, shadeColor(th.groundBody, -22));
    ctx.fillStyle = grad;
    ctx.fillRect(sx, GROUND_Y, w, H - GROUND_Y);
    ctx.fillStyle = th.groundTop;
    ctx.fillRect(sx, GROUND_Y, w, 14);
    ctx.fillStyle = shadeColor(th.groundTop, -18);
    ctx.fillRect(sx, GROUND_Y+11, w, 3);

    // textura de superfície (posição fixa no mundo, não pisca ao rolar a câmera)
    for (var i=0; i*18 < w; i++){
      var wx = x + i*18 + 6;
      var tx = wx - camera.x;
      var s = Math.abs(Math.sin(wx*12.9898) * 43758.5453) % 1;
      if (th.decor === 'snow'){
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.fillRect(tx, GROUND_Y-3, 3, 4);
      } else if (th.decor === 'desert'){
        ctx.fillStyle = 'rgba(120,80,40,0.35)';
        ctx.beginPath(); ctx.arc(tx, GROUND_Y+7+s*4, 2, 0, Math.PI*2); ctx.fill();
      } else if (th.decor === 'torches' || th.decor === 'castle' || th.decor === 'stars'){
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.beginPath(); ctx.arc(tx, GROUND_Y+8+s*5, 1.6, 0, Math.PI*2); ctx.fill();
      } else {
        ctx.fillStyle = shadeColor(th.groundTop, -28);
        ctx.fillRect(tx-1, GROUND_Y-4-s*3, 2, 5+s*3);
      }
    }
  }

  function drawPlatforms(){
    var th = currentTheme;
    platforms.forEach(function(p){
      var sx = p.x - camera.x;
      if (sx + p.w < 0 || sx > W) return;
      var base = p.move ? '#3fb0c9' : th.platformColor;
      var top = p.move ? '#bdf2ff' : th.platformTop;
      var dark = shadeColor(base, -24);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(sx+3, p.y+p.h, p.w-4, 5);
      ctx.fillStyle = dark;
      ctx.fillRect(sx, p.y, p.w, p.h);
      ctx.fillStyle = base;
      ctx.fillRect(sx+2, p.y+2, p.w-4, p.h-4);
      ctx.fillStyle = top;
      ctx.fillRect(sx, p.y, p.w, 6);
      ctx.fillStyle = dark;
      for (var rx = 8; rx < p.w-4; rx += 22){
        ctx.fillRect(sx+rx, p.y+p.h-6, 3, 3);
      }
    });
  }

  function drawCoins(t){
    coins.forEach(function(c){
      if (c.collected) return;
      var sx = c.x - camera.x;
      if (sx < -30 || sx > W+30) return;
      var bob = Math.sin(t/220 + c.x) * 4;
      var cy = c.y + bob;
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath(); ctx.ellipse(sx, c.y+18, 8, 3, 0, 0, Math.PI*2); ctx.fill();
      var grad = ctx.createRadialGradient(sx-3, cy-3, 1, sx, cy, 11);
      grad.addColorStop(0, '#fff6cf');
      grad.addColorStop(0.5, '#ffd23d');
      grad.addColorStop(1, '#e0a400');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(sx, cy, 10, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#c99400';
      ctx.lineWidth = 2;
      ctx.stroke();
      var spin = Math.abs(Math.sin(t/300 + c.x));
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.ellipse(sx, cy, 3*spin+0.5, 8, 0, 0, Math.PI*2);
      ctx.fill();
    });
  }

  function drawFlag(t){
    if (!flag) return;
    var sx = flag.x - camera.x;
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(sx, flag.y, 6, flag.h);
    var wave = Math.sin(t/160) * 6;
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath();
    ctx.moveTo(sx+6, flag.y+6);
    ctx.lineTo(sx+46+wave, flag.y+22);
    ctx.lineTo(sx+6, flag.y+38);
    ctx.closePath();
    ctx.fill();
  }

  function drawSprite(img, x, y, w, h, facing){
    if (!img.complete || img.naturalWidth === 0) return;
    ctx.save();
    ctx.translate(x + w/2, y + h/2);
    ctx.scale(facing, 1);
    ctx.drawImage(img, -w/2, -h/2, w, h);
    ctx.restore();
  }

  function drawEnemies(){
    enemies.forEach(function(en){
      if (!en.alive) return;
      var sx = en.x - camera.x;
      if (sx + en.w < 0 || sx > W) return;
      var prefix = en.type === 1 ? 'enemy2' : 'enemy';
      if (en.squished){
        drawGroundShadow(sx + en.w/2, en.y + en.h + 6, en.w*0.4);
        drawSprite(images[prefix+'_squish'], sx, en.y+10, en.w, en.h, 1);
        return;
      }
      drawGroundShadow(sx + en.w/2, en.y + en.h + 2, en.w*0.42);
      var frame = (Math.floor(Date.now()/160) % 2 === 0) ? images[prefix+'_walk1'] : images[prefix+'_walk2'];
      drawSprite(frame, sx, en.y, en.w, en.h, en.vx >= 0 ? 1 : -1);
      if (en.maxHp > 1){
        var pipW = 6, gap = 2;
        var totalW = en.maxHp*pipW + (en.maxHp-1)*gap;
        var startX = sx + en.w/2 - totalW/2;
        for (var i=0;i<en.maxHp;i++){
          ctx.fillStyle = i < en.hp ? '#ff4d4d' : 'rgba(0,0,0,0.4)';
          ctx.fillRect(startX + i*(pipW+gap), en.y-10, pipW, 4);
        }
      }
    });
  }

  function drawBoss(){
    if (!boss || !boss.alive) return;
    var sx = boss.x - camera.x;
    if (sx + boss.w < 0 || sx > W) return;
    drawGroundShadow(sx + boss.w/2, boss.y + boss.h + 4, boss.w*0.4);
    var frame = (Math.floor(Date.now()/200) % 2 === 0) ? images.boss_walk1 : images.boss_walk2;
    drawSprite(frame, sx, boss.y, boss.w, boss.h, boss.vx >= 0 ? 1 : -1);
    if (boss.invuln > 0 && Math.floor(boss.invuln/4) % 2 === 0){
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#fff';
      ctx.fillRect(sx, boss.y, boss.w, boss.h);
      ctx.restore();
    }
    var barW = 84;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(sx + boss.w/2 - barW/2, boss.y - 18, barW, 9);
    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(sx + boss.w/2 - barW/2, boss.y - 18, barW * Math.max(boss.hp,0)/boss.maxHp, 9);
  }

  function drawPlayer(){
    var sx = player.x - camera.x;
    var sy = player.y;
    var img;
    if (!player.onGround){
      img = images[heroKey('hero_jump')];
    } else if (Math.abs(player.vx) > 0.3){
      img = (Math.floor(Date.now()/110) % 2 === 0) ? images[heroKey('hero_walk1')] : images[heroKey('hero_walk2')];
    } else {
      img = images[heroKey('hero_idle')];
    }
    drawGroundShadow(sx + player.w/2, player.y + player.h + 2, player.w*0.5);
    drawSprite(img, sx-5, sy-4, player.w+10, player.h+8, player.facing);
  }

  function draw(t){
    ctx.save();
    if (shakeTime > 0){
      ctx.translate((Math.random()-0.5)*shakeMag, (Math.random()-0.5)*shakeMag);
    }
    ctx.clearRect(-20,-20,W+40,H+40);
    drawBackground(t);
    if (platforms){
      drawGround();
      drawPlatforms();
      drawFireBars();
      drawFlag(t);
      drawCoins(t);
      drawEnemies();
      drawBoss();
      drawPlayer();
      drawParticles();
    }
    var vg = ctx.createRadialGradient(W/2,H/2, H*0.35, W/2,H/2, H*0.9);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = vg;
    ctx.fillRect(-20,-20,W+40,H+40);
    ctx.restore();
  }

  function loop(t){
    update();
    draw(t || 0);
    requestAnimationFrame(loop);
  }

  platforms = []; gaps = []; coins = []; enemies = []; fireBars = []; flag = null; boss = null; LEVEL_WIDTH = W;
  setupAmbient(currentTheme.decor);
  showIntroScreen();
  requestAnimationFrame(loop);
})();

</script>
