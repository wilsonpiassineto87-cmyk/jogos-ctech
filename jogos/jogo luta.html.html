/* ================= SOM & VOZES ================= */
let AC=null;
function initAudio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)()}
function beep(f0,f1,dur,type,vol){try{initAudio();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f0,AC.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),AC.currentTime+dur);g.gain.setValueAtTime(vol||.15,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur);}catch(e){}}
function battleCry(charName, isSpecial){
 try{
  initAudio();
  const t = AC.currentTime;
  const osc = AC.createOscillator();
  const gain = AC.createGain();
  let baseFreq = 200, type = 'sawtooth', pattern = [1, 1.2, 0.8];
  if(charName.includes('Jotaro')) { baseFreq = 150; pattern = [1, 1.2, 1, 1.2, 1, 1.5]; }
  else if(charName.includes('Dio')) { baseFreq = 120; pattern = [1, 0.8, 1, 0.8, 1.2]; }
  else if(charName.includes('Josuke')) { baseFreq = 180; pattern = [1, 1.3, 1, 1.3, 1.4]; }
  else if(charName.includes('All Might') || charName.includes('Deku')) { baseFreq = 100; type='square'; pattern = [1, 1.5, 2.0]; }
  else if(charName.includes('Bakugo')) { baseFreq = 80; type='sawtooth'; pattern = [1, 2, 0.5, 3]; }
  else if(charName.includes('Naruto')) { baseFreq = 220; pattern = [1, 1.2, 1.5]; }
  else if(charName.includes('Luffy')) { baseFreq = 280; pattern = [1, 1.5, 1.2, 2.0]; }
  else if(charName.includes('Gojo')) { baseFreq = 300; type='sine'; pattern = [1, 2, 3, 4]; }
  osc.type = type; osc.connect(gain); gain.connect(AC.destination);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(isSpecial ? 0.3 : 0.15, t + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, t + (isSpecial ? 0.6 : 0.3));
  const duration = isSpecial ? 0.6 : 0.3;
  const step = duration / pattern.length;
  osc.frequency.setValueAtTime(baseFreq * pattern[0], t);
  for(let i=1; i<pattern.length; i++) osc.frequency.setValueAtTime(baseFreq * pattern[i], t + i*step);
  osc.start(t); osc.stop(t + duration);
 }catch(e){}
}

/* ================= HELPERS DE COR ================= */
function shadeColor(color, percent) {
    var R = parseInt(color.substring(1,3),16);
    var G = parseInt(color.substring(3,5),16);
    var B = parseInt(color.substring(5,7),16);
    R = parseInt(R * (100 + percent) / 100);
    G = parseInt(G * (100 + percent) / 100);
    B = parseInt(B * (100 + percent) / 100);
    R = (R<255)?R:255; G = (G<255)?G:255; B = (B<255)?B:255;  
    var RR = ((R.toString(16).length==1)?"0"+R.toString(16):R.toString(16));
    var GG = ((G.toString(16).length==1)?"0"+G.toString(16):G.toString(16));
    var BB = ((B.toString(16).length==1)?"0"+B.toString(16):B.toString(16));
    return "#"+RR+GG+BB;
}

function makeFighter(ci,p,x,face){const c=CHARS[ci];return{ci,player:p,x,y:GROUND,vx:0,vy:0,facing:face,hp:c.hp,maxhp:c.hp,gauge:0,state:'idle',atk:-1,atkT:0,atkHit:false,cur:null,projCd:0,animT:Math.random()*99|0,flash:0,hitT:0,pop:'',popT:0,blocking:false,onGround:true,aiT:0,aiDir:0,aiJump:false,aiAtk:-1,aiPlan:'in'}}

function sparks(x,y,col,n,shape){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*7,life:18+Math.random()*12,col,sz:3+Math.random()*3,shape:shape||'sq'})}
function ring(x,y,col){for(let i=0;i<14;i++){const a=i/14*6.28;parts.push({x,y,vx:Math.cos(a)*5,vy:Math.sin(a)*5,life:16,col,sz:4,shape:'sq'})}}
function updParts(){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.life--;if(p.life<=0)parts.splice(i,1)}}

function startAtk(f,slot){
 f.state='attack';f.atk=slot;f.atkT=0;f.atkHit=false;
 const c=CHARS[f.ci],s=c.st[slot];
 if(slot === 4) battleCry(c.n, true);
 else if (slot === 3 || (slot < 3 && Math.random() > 0.7)) battleCry(c.n, false);

 if(slot===4){
  f.cur=Object.assign({slot:4},SST[s]);
  ann={txt:c.spe,t:0,dur:75,col:c.fx[2],sz:28,y:150};
  flashA=0.6;hitstop=14;shake=12;
  f.projCd=60;
  ring(f.x,f.y-60,c.fx[2]);
  beep(60,400,.5,'sawtooth',.25);
 }
 else if(PST[s]){
  f.cur={slot,proj:1,st:10,ac:3,rc:16,pv:s};
  f.pop=c.atk[slot];f.popT=38;
  f.projCd=60;
  beep(220,120,.07,'square',.08);
 }
 else{
  f.cur=Object.assign({slot,s},MST[s]);
  f.pop=c.atk[slot];f.popT=38;
  beep(220,120,.07,'square',.08);
 }
}
function doKO(f,foe){
 if(foe.state==='ko')return;
 foe.hp=0; // GARANTE HP ZERO
 foe.state='ko';foe.cur=null;foe.atk=-1;foe.vy=-9;foe.vx=f.facing*6;
 shake=20;hitstop=15;flashA=.7;
 ring(foe.x,foe.y-60,'#ffffff');ring(foe.x,foe.y-60,CHARS[f.ci].fx[2]);
 if(phase==='active'){
  phase='ko';phaseT=0;roundWinner=f.player;wins[f.player]++;
  ann={txt:'K.O.!',t:0,dur:90,col:'#ff3b3b',sz:84,y:240};
  beep(120,30,.6,'sawtooth',.3);
 }
}
function applyHit(f,foe,dmg,a,special){
 if(!foe||foe.state==='ko'||foe.hp<=0)return; // CHECAGEM DUPLA
 const blocked=!special&&foe.blocking;
 const pow=CHARS[f.ci].pow||1;
 let d=dmg*pow*(blocked?0.25:1);
 d=Math.max(1,Math.round(d)); // MÍNIMO 1 DANO (NUNCA ZERO)
 foe.hp=Math.max(0,foe.hp-d); // NUNCA ABAIXO DE ZERO
 foe.x+=f.facing*(a.kb||8)*(blocked?0.4:1);
 if(!blocked){foe.state='hit';foe.hitT=0;foe.flash=8;foe.atk=-1;foe.cur=null;if(a.up){foe.vy=a.up;foe.onGround=false}}
 f.gauge=Math.min(100,f.gauge+(special?0:7));
 foe.gauge=Math.min(100,foe.gauge+4);
 const fx=CHARS[f.ci].fx;
 sparks(foe.x-f.facing*8,foe.y-58,fx[2],blocked?6:14,fx[1]);
 sparks(foe.x-f.facing*8,foe.y-66,CHARS[f.ci].acc,blocked?3:8,fx[1]);
 shake=Math.max(shake,special?18:6);hitstop=Math.max(hitstop,special?12:3);
 beep(special?90:200,40,special?0.35:0.1,'square',.2);
 if(foe.hp<=0)doKO(f,foe); // CHECAGEM IMEDIATA
}
function think(f,foe){
 f.aiT++;f.aiJump=false;f.aiDir=0;f.aiAtk=-1;
 if(f.state==='hit'||f.state==='attack')return;
 const c=CHARS[f.ci],dx=foe.x-f.x,dist=Math.abs(dx),sg=Math.sign(dx)||1;
 if(f.gauge>=100&&dist<300&&Math.random()<0.1){f.aiAtk=4;return}
 if(f.aiT%12===0){
  if(dist>250){f.aiDir=sg;f.aiPlan='in';if(Math.random()<0.06)f.aiJump=true;
   if(Math.random()<0.08&&f.projCd<=0&&c.pSlots.length)f.aiAtk=c.pSlots[(Math.random()*c.pSlots.length)|0];}
  else if(dist>110){f.aiDir=sg;f.aiPlan='in';if(Math.random()<0.2){f.aiAtk=Math.random()<0.5?(c.mSlots[0]||0):(c.pSlots[0]||c.mSlots[0]||0);}}
  else{const r0=Math.random();
   if(r0<0.5&&c.mSlots.length)f.aiAtk=c.mSlots[(Math.random()*c.mSlots.length)|0];
   else if(r0<0.68){f.aiDir=-sg;f.aiPlan='out';}
   else if(r0<0.78){f.aiJump=true;f.aiDir=sg;}
   else f.aiDir=sg;
  }
  if(foe.state==='attack'&&dist<100&&Math.random()<0.45){f.aiDir=-sg;f.aiPlan='out';f.aiAtk=-1;}
 }else{
  if(f.aiPlan==='in')f.aiDir=sg;else if(f.aiPlan==='out')f.aiDir=-sg;
 }
}
function updFighter(f,foe,idx,freeze){
 f.animT++;if(f.flash>0)f.flash--;if(f.projCd>0)f.projCd--;if(f.popT>0)f.popT--;
 
 // BUG FIX: Se estiver KO, física simples e retorna
 if(f.state==='ko'){f.vy+=GRAV;f.y+=f.vy;f.x+=f.vx;f.vx*=0.94;if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.vx*=0.6}f.x=Math.max(46,Math.min(914,f.x));return}
 
 // BUG FIX: Travamento de estado (Safety Timeout)
 if(f.state==='hit'&&f.hitT>40)f.state='idle';
 if(f.state==='attack'&&!f.cur){f.state='idle';f.atk=-1}
 if(f.state==='attack'&&f.cur&&f.atkT>240){f.state='idle';f.atk=-1;f.cur=null}
 
 if(freeze){f.vy+=GRAV;f.y+=f.vy;if(f.y>=GROUND){f.y=GROUND;f.vy=0}
  if(f.state==='hit'){f.hitT++;if(f.hitT>16)f.state='idle'}
  if(f.state==='attack'&&f.cur){f.atkT++;const a=f.cur;if(f.atkT>=a.st+a.ac+a.rc){f.state='idle';f.atk=-1;f.cur=null}}
  return}
 const c=CHARS[f.ci];
 const cpu=(mode===1&&idx===1);
 let dir=0,jump=false,atk=-1;
 if(cpu){think(f,foe);dir=f.aiDir;jump=f.aiJump;atk=f.aiAtk;}
 else{
  const k=KEYMAP[idx];
  dir=(keys[k.right]?1:0)-(keys[k.left]?1:0);
  jump=pressed[k.jump];
  for(let i=0;i<4;i++)for(const cd of k.a[i])if(pressed[cd])atk=i;
  for(const cd of k.sp)if(pressed[cd]){if(f.gauge>=100)atk=4;else if(f.popT<=0){f.pop='ESPECIAL: encha a barra!';f.popT=40}}
 }
 if(f.state==='idle'||f.state==='walk')f.facing=foe.x>=f.x?1:-1;
 const holdBack=dir!==0&&dir===-f.facing;
 f.blocking=f.onGround&&holdBack&&(f.state==='idle'||f.state==='walk');
 if(atk>=0&&(f.state==='idle'||f.state==='walk')){
  if(atk===4){if(f.gauge>=100){f.gauge=0;startAtk(f,4)}}
  else{const s=c.st[atk];
   if(PST[s]){if(f.projCd<=0){startAtk(f,atk)}}
   else startAtk(f,atk);
  }
 }
 if(f.state==='attack'&&f.cur){
  f.atkT++;
  const a=f.cur;
  if(a.proj&&f.atkT===a.st){
   const q=PST[a.pv];
   projs.push({kind:'p',vis:a.pv,x:f.x+f.facing*30,y:f.y-56,vx:f.facing*q.spd,sz:q.sz,life:120,col:c.fx[2],colB:c.acc,owner:idx,dmg:8,shape:c.fx[1]});
   beep(520,180,.16,'triangle',.12);
  }
  else if(a.kind){
   if(a.kind==='beam'){if(f.atkT>=a.st&&f.atkT<a.st+a.ac&&f.atkT%4===0)tryHit(f,foe,{kb:16,up:-6,rg:450},6,true);}
   else if(a.kind==='rush'){if(f.atkT>=a.st&&f.atkT<a.st+a.ac){f.x+=f.facing*4.5;if(f.atkT%5===0)tryHit(f,foe,{kb:5,up:0,rg:80},5,true);}}
   else if(a.kind==='wave'){if(f.atkT===a.st){projs.push({kind:'wave',x:f.x+f.facing*30,y:GROUND,vx:f.facing*6,life:180,col:c.fx[2],owner:idx,dmg:28});beep(120,60,.4,'sawtooth',.2)}}
   else if(a.kind==='fist'){if(f.atkT===a.st){projs.push({kind:'fist',x:f.x+f.facing*30,y:f.y-64,vx:f.facing*5,life:200,col:c.fx[2],owner:idx,dmg:32});beep(90,40,.4,'sawtooth',.25)}}
   else if(a.kind==='bolt'){if(f.atkT===a.st){bolts.push({x:foe.x,t:20,owner:idx,col:c.fx[2],dmg:30,track:foe});beep(800,200,.3,'sawtooth',.15)}}
   else if(a.kind==='field'){if(f.atkT===a.st+4)applyHit(f,foe,26,{kb:16,up:-6},true);}
   else if(a.kind==='swap'){
    if(f.atkT===6){const tx=f.x;f.x=foe.x;foe.x=tx;f.facing=foe.x>f.x?1:-1;foe.facing=f.x>foe.x?1:-1;flashA=.5;ring(f.x,f.y-60,c.fx[2]);ring(foe.x,foe.y-60,'#fff');beep(300,900,.2,'triangle',.2);}
    if(f.atkT===10)applyHit(f,foe,14,{kb:10,up:-4},true);
   }
   else if(a.kind==='storm'){if(f.atkT===a.st)for(let i=0;i<7;i++)projs.push({kind:'p',vis:'star',x:f.x+f.facing*30,y:f.y-80+i*8-20,vx:f.facing*(7+i*1.5),sz:8,life:140,col:c.fx[2],colB:c.acc,owner:idx,dmg:5,shape:'star'});}
  }
  else if(f.atkT>=a.st&&f.atkT<a.st+a.ac){
   if(!f.atkHit&&tryHit(f,foe,a,a.dmg,false))f.atkHit=true;
   if(a.s==='H'||a.s==='S'||a.s==='X')f.x+=f.facing*1.5;
  }
  if(f.atkT>=a.st+a.ac+a.rc){f.state='idle';f.atk=-1;f.cur=null}
 }else if(f.state==='hit'){
  f.hitT++;if(f.hitT>16)f.state='idle';
 }else{
  f.x+=dir*c.spd;
  f.state=dir!==0?'walk':'idle';
  if(jump&&f.onGround){f.vy=-12.6;f.onGround=false;beep(240,420,.08,'triangle',.05)}
 }
 f.vy+=GRAV;f.y+=f.vy;
 if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.onGround=true}else f.onGround=false;
 f.x=Math.max(46,Math.min(914,f.x));
}
function tryHit(f,foe,a,dmg,special){
 if(!foe||foe.state==='ko'||foe.hp<=0)return false;
 const rg=a.rg||(special?400:60);
 const x1=f.x+f.facing*12,x2=f.x+f.facing*(20+rg);
 const lo=Math.min(x1,x2),hi=Math.max(x1,x2);
 if(foe.x+26>lo&&foe.x-26<hi&&Math.abs(foe.y-f.y)<120){applyHit(f,foe,dmg,a,special);return true}
 return false;
}
function pushApart(){
 const dx=f2.x-f1.x;
 if(Math.abs(dx)<40&&Math.abs(f1.y-f2.y)<70){
  const s=dx===0?1:Math.sign(dx),p=(40-Math.abs(dx))/2;
  f1.x=Math.max(46,Math.min(914,f1.x-p*s));
  f2.x=Math.max(46,Math.min(914,f2.x+p*s));
 }
}
function updProjs(){
 for(let i=projs.length-1;i>=0;i--){
  const p=projs[i];p.x+=p.vx;p.life--;
  if(gt%3===0)parts.push({x:p.x-Math.sign(p.vx)*8,y:p.y+(Math.random()-.5)*10,vx:-Math.sign(p.vx),vy:0,life:12,col:p.col,sz:3,shape:p.shape||'sq'});
  const foe=p.owner===0?f2:f1,own=p.owner===0?f1:f2;
  const hb=p.kind==='fist'?50:p.kind==='wave'?40:30;
  const yOk=p.kind==='wave'?(foe.y>GROUND-100):(p.y>foe.y-120&&p.y<foe.y+10);
  if(foe.state!=='ko'&&Math.abs(p.x-foe.x)<hb&&yOk){
   applyHit(own,foe,p.dmg,{kb:p.kind==='fist'?22:p.kind==='wave'?16:8,up:p.kind==='wave'?-6:0},false);
   projs.splice(i,1);continue;
  }
  if(p.life<=0||p.x<-40||p.x>W+40)projs.splice(i,1);
 }
 for(let i=bolts.length-1;i>=0;i--){
  const b=bolts[i];b.t--;
  if(b.track&&b.track.state!=='ko')b.x=b.track.x;
  if(b.t<=0){
   strikes.push({x:b.x,t:16,col:b.col});
   const foe=b.owner===0?f2:f1,own=b.owner===0?f1:f2;
   if(foe.state!=='ko'&&Math.abs(foe.x-b.x)<80)applyHit(own,foe,b.dmg,{kb:12,up:-8},true);
   shake=14;flashA=Math.max(flashA,.35);beep(80,30,.4,'sawtooth',.3);bolts.splice(i,1);
  }
 }
 for(let i=strikes.length-1;i>=0;i--){strikes[i].t--;if(strikes[i].t<=0)strikes.splice(i,1)}
}

 [f1,f2].forEach((f,i)=>{f.hp=f.maxhp;f.x=i?660:300;f.y=GROUND;f.vx=0;f.vy=0;f.state='idle';f.facing=i?-1:1;f.atk=-1;f.cur=null;f.flash=0;f.popT=0});

function drawStage(i,t){

function drawFighter(f){
 const c=CHARS[f.ci], u=4.8;

 cx.fillStyle='rgba(0,0,0,0.4)';cx.beginPath();cx.ellipse(f.x,GROUND+8,28*shadowScale,8*shadowScale,0,0,Math.PI*2);cx.fill();
 
 cx.save();
 cx.translate(Math.round(f.x), Math.round(f.y));
 cx.scale(f.facing, 1);
 
 const white = f.flash > 0;
 const C_ = (hex, mod=0) => white ? '#ffffff' : (mod===0 ? hex : shadeColor(hex, mod));
 
 const OL = (x,y,w,h) => { cx.fillStyle='#0a0a12'; cx.fillRect(x*u-2, y*u-2, w*u+4, h*u+4); };
 const P = (x,y,w,h,col,mod=0) => { OL(x,y,w,h); cx.fillStyle=C_(col,mod); cx.fillRect(x*u, y*u, w*u, h*u); };
 const F = (x,y,w,h,col,mod=0) => { cx.fillStyle=C_(col,mod); cx.fillRect(x*u, y*u, w*u, h*u); };
 
 const skin=c.skin, hair=c.hair, top=c.top, bot=c.bot, belt=c.belt;
 const st=f.state;
 
 if(st==='ko'){
  P(-8,-4,14,4,top); P(-12,-5,5,5,skin); P(6,-3,8,3,bot);
  cx.restore(); return;
 }
 
 const bob = (st==='idle') ? Math.sin(f.animT*0.1)*1.5 : 0;
 const hairBob = (st==='idle') ? Math.sin(f.animT*0.1 + 1)*1 : 0;
 const air = !f.onGround;
 
 if(f.gauge>=100 || (st==='attack' && f.atk===4)){
  cx.globalAlpha=0.6+0.4*Math.sin(gt*0.5);
  for(let i=0;i<8;i++) F(-12+((i*9+gt)%24), -10-((gt*3+i*17)%30), 2, 3, c.fx[2]);
  cx.globalAlpha=1;
 }
 
 if(f.projCd > 0 && st !== 'attack') {
  cx.globalAlpha = 0.6 + Math.sin(gt*0.2)*0.4;
  F(-6, -48+bob, 12, 2, '#ff4a4a');
  cx.globalAlpha = 1;
 }

 const style = (st==='attack' && f.cur && f.atk<4) ? c.st[f.atk] : null;
 const a = f.cur;
 const active = st==='attack' && a && f.atkT>=a.st && f.atkT<a.st+a.ac;
 const windup = st==='attack' && a && f.atkT<a.st;

 let o1=0, o2=0;
 if(st==='walk'){ o1=Math.sin(f.animT*0.35)*3; o2=-o1; }
 
 if(style==='K' && active){
  P(-6, -12+bob, 4, 12, bot, -30); P(-6, 0+bob, 5, 2, '#111');
  P(2, -10, 12, 4, bot); P(14, -11, 4, 5, '#111'); F(14, -8, 4, 1, '#fff');
 } else if(air) {
  P(-6, -10, 4, 8, bot, -30); P(-6, -2, 5, 2, '#111');
  P(2, -8, 4, 6, bot); P(2, -2, 5, 2, '#111');
 } else {
  P(-6+o2, -12+bob, 4, 12, bot, -30); P(-6+o2, 0+bob, 5, 2, '#111'); F(-6+o2, 1+bob, 5, 1, '#aaa');
  P(2+o1, -12+bob, 4, 12, bot); P(2+o1, 0+bob, 5, 2, '#111'); F(2+o1, 1+bob, 5, 1, '#fff');
 }

 P(-5, -24+bob, 10, 12, top);
 F(-5, -24+bob, 2, 12, top, -20);
 F(3, -24+bob, 1, 12, top, 20);
 if(belt) F(-5, -14+bob, 10, 2, belt);

 if(style!=='K') P(-7, -23+bob, 3, 8, top, -30);

function drawProj(p){
 const s=p.sz;
 switch(p.vis){
  case 'shuriken':cx.save();cx.translate(p.x,p.y);cx.rotate(gt*0.4*Math.sign(p.vx));r(-s,-2,s*2,4,'#cfd4dc');r(-2,-s,4,s*2,'#cfd4dc');cx.restore();break;
  case 'knife':cx.save();cx.translate(p.x,p.y);cx.rotate(gt*0.5*Math.sign(p.vx));r(-s,-1,s*2,3,'#cfd4dc');r(-s,-2,3,5,'#8a6a3a');cx.restore();break;
  case 'flame':r(p.x-s,p.y-s,s*2,s*2,p.col);r(p.x-s/2,p.y-s/2,s,s,'#ffd98a');break;
  case 'bolt':r(p.x-s,p.y-2,s*2,4,'#f5f542');r(p.x-s+3,p.y-5,s,3,'#f5f542');r(p.x-3,p.y+2,s,3,'#f5f542');break;
  case 'rock':r(p.x-s,p.y-s,s*2,s*2,p.col);r(p.x-s+2,p.y-s+2,s,s,'#a98a5a');break;
  case 'star':cx.save();cx.translate(p.x,p.y);cx.rotate((gt%2?0.78:0));r(-s,-2,s*2,4,p.col);r(-2,-s,4,s*2,p.col);cx.restore();break;
  case 'nail':r(p.x-s,p.y-1,s*2,2,'#cfd4dc');break;
  case 'bomb':r(p.x-s+1,p.y-s+1,s*2-2,s*2-2,p.col);if((gt/4|0)%2)r(p.x-2,p.y-2,3,3,'#fff');break;
  case 'fist':r(p.x-s,p.y-s,s*2,s*2,'#e8b98a');r(p.x-s+2,p.y-2,s*2-4,3,'#d9a878');break;
  case 'bullet':r(p.x-s-4,p.y-1,s+6,2,p.col);r(p.x-2,p.y-2,4,4,'#fff');break;
  default:r(p.x-s,p.y-s,s*2,s*2,p.col);r(p.x-s+3,p.y-s+3,s*2-6,s*2-6,p.colB||'#fff');
 }
}

  }
 });

 for(let i=0;i<2;i++){cx.fillStyle=wins[1]>i?'#f5c542':'#33334a';cx.beginPath();cx.arc(W-26-bw+12+i*20,54,6,0,Math.PI*2);cx.fill()}
 r(W/2-40,12,80,34,'#0a0a14');cx.strokeStyle='#f5c542';cx.lineWidth=2;cx.strokeRect(W/2-40,12,80,34);
 const mm=Math.floor(Math.max(0,timeLeft)/60),ss=Math.floor(Math.max(0,timeLeft)%60);
 txt(mm+':'+(ss<10?'0':'')+ss,W/2,38,22,timeLeft<=10?'#ff4a4a':'#ffffff');
 txt('ROUND '+roundNum,W/2,60,11,'#9a9ab0');
 gaugeBar(26,H-40,f1.gauge,false,'ESPECIAL: '+KEYSP[0]);
 gaugeBar(W-26-260,H-40,f2.gauge,true,mode===1?'ESPECIAL (CPU)':'ESPECIAL: '+KEYSP[1]);
 
 if(f1.projCd > 0) { txt('AGUARDE...', 150, H-20, 12, '#ff4a4a', 'left'); }
 if(f2.projCd > 0) { txt('AGUARDE...', W-150, H-20, 12, '#ff4a4a', 'right'); }
}
function drawAnn(){
 const p=Math.min(1,ann.t/6),fade=ann.t>ann.dur-15?(ann.dur-ann.t)/15:1;
 cx.save();cx.globalAlpha=Math.max(0,Math.min(1,fade));
 cx.translate(W/2,ann.y||230);cx.scale(p,p);
 txtO(ann.txt,0,0,ann.sz||60,ann.col||'#fff');
 cx.restore();
}
function drawEnd(){
 cx.fillStyle='rgba(5,5,15,0.78)';cx.fillRect(0,0,W,H);
 let big,col,sub;
 if(mode===1){
  if(matchWinner===0){big='VITÓRIA!';col='#f5c542';sub=CHARS[f1.ci].n+' triunfou!'}
  else{big='DERROTA...';col='#8a8aa0';sub='A CPU venceu desta vez.'}
 }else{
  big='JOGADOR '+(matchWinner+1)+' VENCEU!';
  col=matchWinner===0?'#ff6a6a':'#6ab0ff';
  sub=CHARS[matchWinner===0?f1.ci:f2.ci].n+' é o campeão!';
 }
 const s=Math.min(1,endT/15);
 cx.save();cx.translate(W/2,220);cx.scale(s,s);txtO(big,0,0,72,col);cx.restore();
 txt(sub,W/2,280,20,'#fff');
 txt('PLACAR  '+wins[0]+' x '+wins[1],W/2,320,18,'#cfd0e0');
 if(endT>50&&((gt/30|0)%2===0))txt('[ENTER] REVANCHE      [ESC] TROCAR PERSONAGENS',W/2,400,17,'#f5c542');
}

/* ================= DESENHO GERAL ================= */
function draw(){
 cx.setTransform(1,0,0,1,0,0);
 if(state==='title'){drawTitle();return}
 if(state==='select'){drawSelect();return}
 if(state==='stage'){drawStageSelect();return}
 cx.save();
 if(shake>0){cx.translate((Math.random()-.5)*shake|0,(Math.random()-.5)*shake|0);shake*=0.86;if(shake<0.4)shake=0}
 drawStage(curStage,gt);
 drawFighter(f2);drawFighter(f1);
 drawSpecials();
 projs.forEach(p=>{
  if(p.kind==='wave'){r(p.x-20,GROUND-54,40,54,p.col);r(p.x-12,GROUND-62,24,12,'#fff');if(gt%2===0)sparks(p.x,p.y-40,p.col,1,'sq');}
  else if(p.kind==='fist'){
   cx.strokeStyle=p.col;cx.lineWidth=3;cx.beginPath();cx.arc(p.x,p.y,30+((gt*2)%14),0,7);cx.stroke();
   r(p.x-24,p.y-24,48,48,p.col);r(p.x-14,p.y-14,28,28,'#fff');
  }
  else drawProj(p);
 });
 parts.forEach(p=>{
  cx.globalAlpha=Math.min(1,p.life/10);cx.fillStyle=p.col;
  if(p.shape==='star'){cx.fillRect(p.x-p.sz,p.y-1,p.sz*2,2);cx.fillRect(p.x-1,p.y-p.sz,2,p.sz*2)}
  else if(p.shape==='cross'){cx.save();cx.translate(p.x,p.y);cx.rotate(.78);cx.fillRect(-p.sz,-1,p.sz*2,2);cx.fillRect(-1,-p.sz,2,p.sz*2);cx.restore()}
  else if(p.shape==='circle'){cx.beginPath();cx.arc(p.x,p.y,p.sz/2,0,7);cx.fill()}
  else if(p.shape==='spark4'){cx.fillRect(p.x-p.sz,p.y-1,p.sz*2,2);cx.fillRect(p.x-1,p.y-p.sz,2,p.sz*2);cx.save();cx.translate(p.x,p.y);cx.rotate(.78);cx.fillRect(-p.sz/1.4,-1,p.sz*1.4,2);cx.fillRect(-1,-p.sz/1.4,2,p.sz*1.4);cx.restore()}
  else cx.fillRect(p.x,p.y,p.sz,p.sz);
  cx.globalAlpha=1;
 });
 cx.restore();
 if(flashA>0){cx.globalAlpha=Math.max(0,flashA);cx.fillStyle='#fff';cx.fillRect(0,0,W,H);cx.globalAlpha=1}
 drawHUD();
 if(ann)drawAnn();
 if(state==='end')drawEnd();
}

/* ================= LOOP ================= */
function update(){
 if(state==='title')updTitle();
 else if(state==='select')updSelect();
 else if(state==='stage')updStage();
 else if(state==='fight')updFight();
 else if(state==='end')updEnd();
}
function loop(){
 gt++;
 update();
 draw();
 for(const k in pressed)pressed[k]=false;
 requestAnimationFrame(loop);
}
loop();
</script>

<style id="tc-style">
#tc-ov{position:fixed;left:0;right:0;bottom:0;z-index:999999;display:none;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none;font-family:Arial,Helvetica,sans-serif}
@media (pointer:coarse){#tc-ov{display:flex}}
#tc-ov .tc-pad{position:relative;width:150px;height:150px;pointer-events:auto;flex-shrink:0}
#tc-ov .tc-pad button{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:12px;color:#fff;font-size:20px;line-height:1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#tc-ov .tc-pad .tc-up{top:0;left:50px}
#tc-ov .tc-pad .tc-down{bottom:0;left:50px}
#tc-ov .tc-pad .tc-left{top:50px;left:0}
#tc-ov .tc-pad .tc-right{top:50px;right:0}
#tc-ov .tc-actions{display:flex;gap:10px;pointer-events:auto;align-items:flex-end;flex-shrink:0}
#tc-ov .tc-actions button{min-width:56px;height:56px;padding:0 10px;border-radius:28px;background:rgba(0,180,255,.22);border:2px solid rgba(0,180,255,.6);color:#fff;font-weight:700;font-size:11px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>

<div id="tc-ov"></div>
<script id="tc-script">
(function(){
  var DPAD=[{'dir': 'left', 'code': 'KeyA', 'key': 'a'}, {'dir': 'right', 'code': 'KeyD', 'key': 'd'}, {'dir': 'up', 'code': 'KeyW', 'key': 'w'}];
  var ACTS=[{'code': 'KeyJ', 'key': 'j', 'label': 'SOCO'}, {'code': 'KeyK', 'key': 'k', 'label': 'CHUTE'}, {'code': 'KeyL', 'key': 'l', 'label': 'FORTE'}, {'code': 'Space', 'key': ' ', 'label': 'ESPECIAL'}];
  var ov=document.getElementById('tc-ov');
  var glyph={up:'\u25B2',down:'\u25BC',left:'\u25C0',right:'\u25B6'};
  function fire(type,code,key){
    var ev=new KeyboardEvent(type,{code:code,key:key,bubbles:true,cancelable:true});
    window.dispatchEvent(ev); document.dispatchEvent(ev);
  }
  function bind(btn,code,key){
    var isDown=false;
    var down=function(e){ if(isDown)return; isDown=true; e.preventDefault(); fire('keydown',code,key); };
    var up=function(e){ if(!isDown)return; isDown=false; e.preventDefault(); fire('keyup',code,key); };
    btn.addEventListener('pointerdown',down);
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointercancel',up);
    btn.addEventListener('pointerleave',up);
    btn.addEventListener('touchstart',down,{passive:false});
    btn.addEventListener('touchend',up,{passive:false});
    btn.addEventListener('touchcancel',up,{passive:false});
    btn.addEventListener('mousedown',down);
    btn.addEventListener('mouseup',up);
    btn.addEventListener('mouseleave',up);
    btn.addEventListener('contextmenu',function(e){e.preventDefault();});
  }
  if(DPAD.length){
    var pad=document.createElement('div'); pad.className='tc-pad';
    DPAD.forEach(function(d){
      var b=document.createElement('button'); b.className='tc-'+d.dir; b.textContent=glyph[d.dir];
      bind(b,d.code,d.key); pad.appendChild(b);
    });
    ov.appendChild(pad);
  }
  if(ACTS.length){
    var act=document.createElement('div'); act.className='tc-actions';
    ACTS.forEach(function(a){
      var b=document.createElement('button'); b.textContent=a.label;
      bind(b,a.code,a.key); act.appendChild(b);
    });
    ov.appendChild(act);
  }
})();
</script>
</body>
