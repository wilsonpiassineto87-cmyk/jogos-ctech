<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>SKY STRIKER - Jogo de Avião</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        overflow: hidden;
    }
    #gameContainer { position: relative; }
    canvas {
        display: block;
        border: 3px solid #444;
        border-radius: 8px;
        box-shadow: 0 0 40px rgba(0,150,255,0.3);
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="900" height="600"></canvas>

<script>
// ============================================================
//  SKY STRIKER - Jogo de Avião Completo (VERSÃO CORRIGIDA)
//  Recursos: Inimigos, Fases, Bosses, Power-ups, Efeitos
// ============================================================

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ============ ÁUDIO SINTETIZADO ============
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playSound(freq, duration, type = 'square', vol = 0.08) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
}

const sounds = {
    shoot: () => playSound(800, 0.1, 'square', 0.05),
    enemyShoot: () => playSound(300, 0.15, 'sawtooth', 0.04),
    hit: () => playSound(200, 0.1, 'sawtooth', 0.06),
    explosion: () => {
        playSound(100, 0.3, 'sawtooth', 0.1);
        playSound(60, 0.4, 'triangle', 0.1);
    },
    powerup: () => {
        playSound(523, 0.1, 'sine', 0.1);
        setTimeout(() => playSound(659, 0.1, 'sine', 0.1), 80);
        setTimeout(() => playSound(784, 0.15, 'sine', 0.1), 160);
    },
    damage: () => playSound(150, 0.2, 'sawtooth', 0.08),
    levelUp: () => {
        [523, 659, 784, 1047].forEach((f, i) => 
            setTimeout(() => playSound(f, 0.2, 'sine', 0.1), i * 120)
        );
    },
    gameOver: () => {
        [400, 350, 300, 200].forEach((f, i) => 
            setTimeout(() => playSound(f, 0.3, 'triangle', 0.1), i * 200)
        );
    },
    bomb: () => playSound(80, 0.5, 'sawtooth', 0.15)
};

// ============ ESTADOS DO JOGO ============
const STATE = { MENU: 0, PLAYING: 1, LEVEL_CLEAR: 2, GAME_OVER: 3 };
let gameState = STATE.MENU;

// ============ VARIÁVEIS GLOBAIS ============
let score = 0;
let highScore = 0;
let level = 1;
let levelProgress = 0;
let levelGoal = 10;
let isBossLevel = false;
let frameCount = 0;
let screenShake = 0;
let bombs = 3;

let playerBullets = [];
let enemyBullets = [];
let enemies = [];
let powerups = [];
let particles = [];
let stars = [];
let clouds = [];
let floatingTexts = [];
let boss = null;

// Inicializar fundo
for (let i = 0; i < 50; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 1 + 0.3
    });
}
for (let i = 0; i < 6; i++) {
    clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.7,
        size: Math.random() * 40 + 30,
        speed: Math.random() * 0.5 + 0.2,
        opacity: Math.random() * 0.3 + 0.1
    });
}

// ============ JOGADOR ============
const player = {
    x: 100,
    y: H / 2,
    width: 50,
    height: 30,
    speed: 5,
    hp: 100,
    maxHp: 100,
    lives: 3,
    shootCooldown: 0,
    shootRate: 15,
    rapidFire: 0,
    tripleShot: 0,
    shield: 0,
    invincible: 0,
    bombCooldown: 0,
    
    reset() {
        this.x = 100;
        this.y = H / 2;
        this.hp = this.maxHp;
        this.lives = 3;
        this.rapidFire = 0;
        this.tripleShot = 0;
        this.shield = 0;
        this.invincible = 0;
    },
    
    update() {
        if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
        if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
        if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
        if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
        
        this.x = Math.max(20, Math.min(W - 60, this.x));
        this.y = Math.max(20, Math.min(H - 20, this.y));
        
        if (this.rapidFire > 0) this.rapidFire--;
        if (this.tripleShot > 0) this.tripleShot--;
        if (this.shield > 0) this.shield--;
        if (this.invincible > 0) this.invincible--;
        if (this.shootCooldown > 0) this.shootCooldown--;
        if (this.bombCooldown > 0) this.bombCooldown--;
        
        if ((keys['Space'] || keys['KeyJ']) && this.shootCooldown <= 0) {
            this.shoot();
        }
        
        if ((keys['KeyK'] || keys['ShiftLeft']) && bombs > 0 && this.bombCooldown <= 0) {
            this.useBomb();
        }
        
        if (frameCount % 2 === 0) {
            particles.push(new Particle(
                this.x - 5, this.y + this.height / 2,
                '#ff6600', 0.5, 2
            ));
        }
    },
    
    shoot() {
        const rate = this.rapidFire > 0 ? 6 : this.shootRate;
        this.shootCooldown = rate;
        sounds.shoot();
        
        const bulletX = this.x + this.width;
        const bulletY = this.y + this.height / 2;
        
        playerBullets.push(new Bullet(bulletX, bulletY, 12, 0, '#00ffff'));
        
        if (this.tripleShot > 0) {
            playerBullets.push(new Bullet(bulletX, bulletY, 11, -3, '#00ffff'));
            playerBullets.push(new Bullet(bulletX, bulletY, 11, 3, '#00ffff'));
        }
    },
    
    useBomb() {
        bombs--;
        this.bombCooldown = 30;
        sounds.bomb();
        screenShake = 20;
        
        enemies.forEach(e => {
            createExplosion(e.x + e.width/2, e.y + e.height/2, '#ff4444');
            score += e.points;
            levelProgress++;
        });
        enemies = [];
        enemyBullets = [];
        
        // Bomba também danifica o boss
        if (boss && boss.active && !boss.dying) {
            for (let i = 0; i < 10; i++) {
                boss.takeDamage();
            }
        }
        
        for (let i = 0; i < 30; i++) {
            particles.push(new Particle(
                Math.random() * W, Math.random() * H,
                '#ffffff', 1, 4
            ));
        }
        
        if (!isBossLevel && levelProgress >= levelGoal) {
            levelClear();
        }
    },
    
    takeDamage(amount) {
        if (this.invincible > 0 || this.shield > 0) return;
        
        this.hp -= amount;
        this.invincible = 60;
        screenShake = 10;
        sounds.damage();
        
        if (this.hp <= 0) {
            this.lives--;
            if (this.lives > 0) {
                this.hp = this.maxHp;
                this.invincible = 120;
                createExplosion(this.x, this.y, '#00aaff');
            } else {
                gameOver();
            }
        }
    },
    
    draw() {
        ctx.save();
        
        if (this.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0) {
            ctx.globalAlpha = 0.5;
        }
        
        const x = this.x;
        const y = this.y;
        
        if (this.shield > 0) {
            ctx.strokeStyle = `rgba(0, 200, 255, ${0.5 + Math.sin(frameCount * 0.2) * 0.3})`;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x + 25, y + 15, 35, 0, Math.PI * 2);
            ctx.stroke();
        }
        
        ctx.fillStyle = '#2196F3';
        ctx.beginPath();
        ctx.moveTo(x + 50, y + 15);
        ctx.lineTo(x + 35, y + 5);
        ctx.lineTo(x + 10, y + 5);
        ctx.lineTo(x, y + 12);
        ctx.lineTo(x, y + 18);
        ctx.lineTo(x + 10, y + 25);
        ctx.lineTo(x + 35, y + 25);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#1976D2';
        ctx.beginPath();
        ctx.moveTo(x + 20, y + 15);
        ctx.lineTo(x + 30, y + 15);
        ctx.lineTo(x + 22, y + 30);
        ctx.lineTo(x + 15, y + 28);
        ctx.closePath();
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(x + 20, y + 15);
        ctx.lineTo(x + 30, y + 15);
        ctx.lineTo(x + 22, y);
        ctx.lineTo(x + 15, y + 2);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#1565C0';
        ctx.beginPath();
        ctx.moveTo(x + 5, y + 10);
        ctx.lineTo(x + 2, y);
        ctx.lineTo(x + 12, y + 8);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = '#80DEEA';
        ctx.beginPath();
        ctx.ellipse(x + 32, y + 13, 6, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        
        if (frameCount % 4 < 2) {
            ctx.strokeStyle = '#90A4AE';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 50, y + 8);
            ctx.lineTo(x + 50, y + 22);
            ctx.stroke();
        }
        
        ctx.restore();
    }
};

// ============ BALAS ============
class Bullet {
    constructor(x, y, vx, vy, color, size = 5) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.active = true;
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) {
            this.active = false;
        }
    }
    
    draw() {
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

// ============ PARTÍCULAS ============
class Particle {
    constructor(x, y, color, life = 1, size = 3) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 6;
        this.vy = (Math.random() - 0.5) * 6;
        this.color = color;
        this.life = life;
        this.maxLife = life;
        this.size = size;
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.05;
        this.life -= 0.02;
    }
    
    draw() {
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.globalAlpha = 1;
    }
}

function createExplosion(x, y, color = '#ff6600', count = 15) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, color, 1, Math.random() * 4 + 2));
    }
    particles.push(new Particle(x, y, '#ffffff', 0.5, 10));
}

function showFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 60 });
}

// ============ POWER-UPS ============
const POWERUP_TYPES = [
    { type: 'health', color: '#4CAF50', symbol: '+', desc: 'VIDA' },
    { type: 'rapid', color: '#FFC107', symbol: '>>', desc: 'TIRO RÁPIDO' },
    { type: 'triple', color: '#9C27B0', symbol: '///', desc: 'TIRO TRIPLO' },
    { type: 'shield', color: '#00BCD4', symbol: 'O', desc: 'ESCUDO' },
    { type: 'bomb', color: '#F44336', symbol: '*', desc: 'BOMBA' }
];

class PowerUp {
    constructor(x, y) {
        const typeData = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
        this.x = x;
        this.y = y;
        this.type = typeData.type;
        this.color = typeData.color;
        this.symbol = typeData.symbol;
        this.size = 15;
        this.active = true;
        this.angle = 0;
    }
    
    update() {
        this.x -= 2;
        this.y += Math.sin(frameCount * 0.05 + this.x * 0.01) * 0.5;
        this.angle += 0.1;
        if (this.x < -30) this.active = false;
    }
    
    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle * 0.3);
        
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 15;
        
        ctx.fillStyle = this.color;
        ctx.fillRect(-this.size, -this.size, this.size * 2, this.size * 2);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-this.size, -this.size, this.size * 2, this.size * 2);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.symbol, 0, 0);
        
        ctx.restore();
    }
    
    apply() {
        sounds.powerup();
        switch(this.type) {
            case 'health':
                player.hp = Math.min(player.maxHp, player.hp + 40);
                showFloatingText('+40 HP', player.x, player.y - 30, '#4CAF50');
                break;
            case 'rapid':
                player.rapidFire = 600;
                showFloatingText('TIRO RÁPIDO!', player.x, player.y - 30, '#FFC107');
                break;
            case 'triple':
                player.tripleShot = 600;
                showFloatingText('TIRO TRIPLO!', player.x, player.y - 30, '#9C27B0');
                break;
            case 'shield':
                player.shield = 400;
                showFloatingText('ESCUDO!', player.x, player.y - 30, '#00BCD4');
                break;
            case 'bomb':
                bombs = Math.min(5, bombs + 1);
                showFloatingText('+1 BOMBA', player.x, player.y - 30, '#F44336');
                break;
        }
    }
}

// ============ INIMIGOS ============
class Enemy {
    constructor(type, x, y) {
        this.type = type;
        this.x = x;
        this.y = y;
        this.active = true;
        this.shootTimer = Math.random() * 100;
        this.angle = Math.random() * Math.PI * 2;
        this.baseY = y;
        
        const configs = {
            drone:   { hp: 1, speed: 3, width: 35, height: 25, points: 100, color: '#F44336' },
            fighter: { hp: 2, speed: 2.5, width: 40, height: 30, points: 200, color: '#9C27B0' },
            bomber:  { hp: 4, speed: 1.5, width: 50, height: 40, points: 350, color: '#607D8B' },
            zigzag:  { hp: 2, speed: 3, width: 35, height: 28, points: 250, color: '#FF9800' }
        };
        
        const config = configs[type] || configs.drone;
        Object.assign(this, config);
        this.maxHp = this.hp;
    }
    
    update() {
        this.angle += 0.05;
        
        switch(this.type) {
            case 'drone':
                this.x -= this.speed;
                break;
            case 'fighter':
                this.x -= this.speed;
                this.y = this.baseY + Math.sin(this.angle) * 40;
                this.shootTimer--;
                if (this.shootTimer <= 0 && this.x < W - 50) {
                    this.shootTimer = 80 + Math.random() * 60;
                    this.shootAtPlayer();
                }
                break;
            case 'bomber':
                this.x -= this.speed;
                this.shootTimer--;
                if (this.shootTimer <= 0 && this.x < W - 50) {
                    this.shootTimer = 100 + Math.random() * 50;
                    this.shootSpread();
                }
                break;
            case 'zigzag':
                this.x -= this.speed;
                this.y = this.baseY + Math.sin(this.angle * 2) * 80;
                break;
        }
        
        if (this.x < -60) this.active = false;
    }
    
    shootAtPlayer() {
        const dx = player.x - this.x;
        const dy = player.y - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const speed = 4;
        enemyBullets.push(new Bullet(
            this.x, this.y + this.height / 2,
            (dx / dist) * speed,
            (dy / dist) * speed,
            '#ff4444', 4
        ));
        sounds.enemyShoot();
    }
    
    shootSpread() {
        for (let i = -1; i <= 1; i++) {
            enemyBullets.push(new Bullet(
                this.x, this.y + this.height / 2,
                -4, i * 2,
                '#ff6600', 4
            ));
        }
        sounds.enemyShoot();
    }
    
    takeDamage() {
        this.hp--;
        sounds.hit();
        
        particles.push(new Particle(
            this.x + this.width/2, this.y + this.height/2,
            '#ffffff', 0.3, 6
        ));
        
        if (this.hp <= 0) {
            this.active = false;
            createExplosion(this.x + this.width/2, this.y + this.height/2, this.color);
            sounds.explosion();
            score += this.points;
            levelProgress++;
            
            if (Math.random() < 0.15) {
                powerups.push(new PowerUp(this.x, this.y));
            }
            
            showFloatingText('+' + this.points, this.x, this.y, '#FFD700');
            
            if (!isBossLevel && levelProgress >= levelGoal) {
                levelClear();
            }
        }
    }
    
    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        
        const w = this.width;
        const h = this.height;
        
        switch(this.type) {
            case 'drone':
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(-w/2, 0);
                ctx.lineTo(-w/4, -h/2);
                ctx.lineTo(w/3, -h/3);
                ctx.lineTo(w/2, 0);
                ctx.lineTo(w/3, h/3);
                ctx.lineTo(-w/4, h/2);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#B71C1C';
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fill();
                break;
                
            case 'fighter':
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(-w/2, 0);
                ctx.lineTo(-w/4, -h/2);
                ctx.lineTo(w/4, -h/3);
                ctx.lineTo(w/2, 0);
                ctx.lineTo(w/4, h/3);
                ctx.lineTo(-w/4, h/2);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#7B1FA2';
                ctx.fillRect(-5, -h/2 - 5, 10, 8);
                ctx.fillRect(-5, h/2 - 3, 10, 8);
                break;
                
            case 'bomber':
                ctx.fillStyle = this.color;
                ctx.fillRect(-w/2, -h/2, w, h);
                ctx.fillStyle = '#455A64';
                ctx.fillRect(-w/2 + 5, -h/2 + 5, w - 10, h - 10);
                ctx.fillStyle = '#37474F';
                ctx.fillRect(-w/2 - 8, -3, 10, 6);
                break;
                
            case 'zigzag':
                ctx.fillStyle = this.color;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 + this.angle;
                    const r = i % 2 === 0 ? w/2 : w/3;
                    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
                break;
        }
        
        ctx.restore();
        
        if (this.maxHp > 1 && this.hp < this.maxHp) {
            const barW = this.width;
            const barH = 4;
            const barX = this.x;
            const barY = this.y - 10;
            
            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(barX, barY, barW * (this.hp / this.maxHp), barH);
        }
    }
}

// ============ BOSS (VERSÃO CORRIGIDA) ============
class Boss {
    constructor(level) {
        this.x = W + 100;
        this.y = H / 2 - 60;
        this.width = 120;
        this.height = 100;
        
        // HP CORRIGIDO: valor balanceado
        this.maxHp = 60 + (level * 10);
        this.hp = this.maxHp;
        
        this.speed = 1.5;
        this.phase = 0;
        this.angle = 0;
        this.shootTimer = 0;
        this.patternTimer = 0;
        this.active = true;
        this.entering = true;
        this.points = 5000;
        this.baseY = H / 2 - 50;
        
        // Sistema de morte corrigido (sem setTimeout)
        this.dying = false;
        this.deathTimer = 0;
        this.flashTimer = 0;
    }
    
    update() {
        // Animacao de morte
        if (this.dying) {
            this.deathTimer++;
            
            if (this.deathTimer % 10 === 0) {
                createExplosion(
                    this.x + Math.random() * this.width,
                    this.y + Math.random() * this.height,
                    '#ff4400', 15
                );
                sounds.explosion();
                screenShake = 5;
            }
            
            if (this.deathTimer >= 60) {
                this.active = false;
                levelClear();
            }
            return;
        }
        
        this.angle += 0.03;
        if (this.flashTimer > 0) this.flashTimer--;
        
        if (this.entering) {
            this.x -= 2;
            if (this.x <= W - 200) {
                this.entering = false;
            }
            return;
        }
        
        this.y = this.baseY + Math.sin(this.angle) * 80;
        this.y = Math.max(20, Math.min(H - this.height - 20, this.y));
        
        this.shootTimer--;
        this.patternTimer++;
        
        if (this.patternTimer > 150) {
            this.patternTimer = 0;
            this.phase = (this.phase + 1) % 3;
        }
        
        if (this.shootTimer <= 0) {
            switch(this.phase) {
                case 0:
                    this.shootTimer = 40;
                    this.shootAtPlayer();
                    break;
                case 1:
                    this.shootTimer = 70;
                    this.shootFan();
                    break;
                case 2:
                    this.shootTimer = 15;
                    this.shootRandom();
                    break;
            }
        }
    }
    
    shootAtPlayer() {
        const dx = player.x - (this.x + 20);
        const dy = player.y - (this.y + this.height/2);
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        enemyBullets.push(new Bullet(
            this.x + 20, this.y + this.height/2,
            (dx/dist) * 4, (dy/dist) * 4,
            '#ff0000', 5
        ));
        sounds.enemyShoot();
    }
    
    shootFan() {
        for (let i = -2; i <= 2; i++) {
            enemyBullets.push(new Bullet(
                this.x + 20, this.y + this.height/2,
                -4, i * 1.2,
                '#ff6600', 4
            ));
        }
        sounds.enemyShoot();
    }
    
    shootRandom() {
        enemyBullets.push(new Bullet(
            this.x + 20, 
            this.y + this.height/2 + (Math.random()-0.5) * 40,
            -5, (Math.random()-0.5) * 1.5,
            '#ffaa00', 4
        ));
        sounds.enemyShoot();
    }
    
    takeDamage() {
        if (this.dying) return;
        
        this.hp--;
        this.flashTimer = 5;
        sounds.hit();
        
        particles.push(new Particle(
            this.x + 20, this.y + this.height/2,
            '#ffffff', 0.4, 5
        ));
        
        if (this.hp <= 0) {
            this.dying = true;
            this.deathTimer = 0;
            score += this.points;
            showFloatingText('+' + this.points, this.x, this.y - 20, '#FFD700');
            
            for (let i = 0; i < 3; i++) {
                powerups.push(new PowerUp(this.x + 30 + i * 30, this.y + 40));
            }
        }
    }
    
    draw() {
        ctx.save();
        ctx.translate(this.x + this.width/2, this.y + this.height/2);
        
        if (this.flashTimer > 0) {
            ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = '#B71C1C';
        }
        
        ctx.beginPath();
        ctx.moveTo(-this.width/2, 0);
        ctx.lineTo(-this.width/3, -this.height/2);
        ctx.lineTo(this.width/3, -this.height/2);
        ctx.lineTo(this.width/2, 0);
        ctx.lineTo(this.width/3, this.height/2);
        ctx.lineTo(-this.width/3, this.height/2);
        ctx.closePath();
        ctx.fill();
        
        ctx.fillStyle = this.flashTimer > 0 ? '#dddddd' : '#7f0000';
        ctx.fillRect(-this.width/3, -this.height/3, this.width/1.5, this.height/1.5);
        
        ctx.fillStyle = '#333';
        ctx.fillRect(-this.width/2 - 15, -8, 20, 16);
        
        const pulse = 0.5 + Math.sin(frameCount * 0.1) * 0.3;
        ctx.fillStyle = `rgba(255, 0, 0, ${pulse})`;
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff0000';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        ctx.restore();
        
        // Barra de HP com numeros
        const barW = 300;
        const barH = 20;
        const barX = W/2 - barW/2;
        const barY = 15;
        
        ctx.fillStyle = '#333';
        ctx.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
        
        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillStyle = hpPercent > 0.5 ? '#F44336' : (hpPercent > 0.25 ? '#FF9800' : '#ff0000');
        ctx.fillRect(barX, barY, barW * hpPercent, barH);
        
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.strokeRect(barX - 2, barY - 2, barW + 4, barH + 4);
        
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`BOSS ${Math.max(0, this.hp)}/${this.maxHp}`, W/2, barY + 14);
    }
}

// ============ SPAWN DE INIMIGOS ============
let spawnTimer = 0;

function spawnEnemy() {
    if (isBossLevel) return;
    
    spawnTimer--;
    if (spawnTimer > 0) return;
    
    const spawnRate = Math.max(30, 90 - level * 8);
    spawnTimer = spawnRate + Math.random() * 30;
    
    if (enemies.length > 8) return;
    if (levelProgress >= levelGoal) return;
    
    const y = Math.random() * (H - 100) + 50;
    
    let types = ['drone'];
    if (level >= 2) types.push('fighter');
    if (level >= 3) types.push('zigzag');
    if (level >= 4) types.push('bomber');
    
    const type = types[Math.floor(Math.random() * types.length)];
    enemies.push(new Enemy(type, W + 50, y));
}

// ============ CONTROLE DE FASES ============
function setupLevel() {
    isBossLevel = (level % 3 === 0);
    
    if (isBossLevel) {
        levelGoal = 1;
        boss = new Boss(level);
    } else {
        levelGoal = 8 + level * 4;
        boss = null;
    }
    
    levelProgress = 0;
    spawnTimer = 60;
}

function levelClear() {
    if (gameState === STATE.LEVEL_CLEAR) return;
    gameState = STATE.LEVEL_CLEAR;
    sounds.levelUp();
    score += 1000 * level;
}

function nextLevel() {
    level++;
    levelProgress = 0;
    setupLevel();
    gameState = STATE.PLAYING;
}

// ============ CONTROLE DE JOGO ============
function startGame() {
    initAudio();
    score = 0;
    level = 1;
    bombs = 3;
    player.reset();
    playerBullets = [];
    enemyBullets = [];
    enemies = [];
    powerups = [];
    particles = [];
    floatingTexts = [];
    boss = null;
    setupLevel();
    gameState = STATE.PLAYING;
}

function gameOver() {
    gameState = STATE.GAME_OVER;
    sounds.gameOver();
    highScore = Math.max(highScore, score);
    createExplosion(player.x + 25, player.y + 15, '#00aaff', 30);
}

// ============ INPUT ============
const keys = {};
window.addEventListener('keydown', (e) => {
    keys[e.code] = true;
    
    if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === STATE.MENU || gameState === STATE.GAME_OVER) {
            startGame();
        } else if (gameState === STATE.LEVEL_CLEAR) {
            nextLevel();
        }
    }
});
window.addEventListener('keyup', (e) => keys[e.code] = false);

// ============ COLISÕES (CORRIGIDO) ============
function checkCollisions() {
    for (let bullet of playerBullets) {
        if (!bullet.active) continue;
        
        for (let enemy of enemies) {
            if (!enemy.active) continue;
            if (bullet.x > enemy.x && bullet.x < enemy.x + enemy.width &&
                bullet.y > enemy.y && bullet.y < enemy.y + enemy.height) {
                bullet.active = false;
                enemy.takeDamage();
                break;
            }
        }
        
        if (bullet.active && boss && boss.active && !boss.dying && !boss.entering) {
            if (bullet.x > boss.x && 
                bullet.x < boss.x + boss.width &&
                bullet.y > boss.y && 
                bullet.y < boss.y + boss.height) {
                bullet.active = false;
                boss.takeDamage();
            }
        }
    }
    
    if (player.invincible <= 0 && player.shield <= 0) {
        enemyBullets.forEach(bullet => {
            if (!bullet.active) return;
            if (bullet.x > player.x && bullet.x < player.x + player.width &&
                bullet.y > player.y && bullet.y < player.y + player.height) {
                bullet.active = false;
                player.takeDamage(15);
            }
        });
    }
    
    enemies.forEach(enemy => {
        if (!enemy.active) return;
        if (player.x < enemy.x + enemy.width &&
            player.x + player.width > enemy.x &&
            player.y < enemy.y + enemy.height &&
            player.y + player.height > enemy.y) {
            enemy.active = false;
            createExplosion(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
            player.takeDamage(30);
        }
    });
    
    powerups.forEach(pu => {
        if (!pu.active) return;
        const dist = Math.sqrt(
            Math.pow(pu.x - (player.x + 25), 2) + 
            Math.pow(pu.y - (player.y + 15), 2)
        );
        if (dist < 40) {
            pu.active = false;
            pu.apply();
        }
    });
}

// ============ DESENHO ============
function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    if (isBossLevel) {
        gradient.addColorStop(0, '#1a0a2e');
        gradient.addColorStop(1, '#2d1b4e');
    } else if (level <= 3) {
        gradient.addColorStop(0, '#1e3c72');
        gradient.addColorStop(1, '#2a5298');
    } else {
        gradient.addColorStop(0, '#0f2027');
        gradient.addColorStop(1, '#203a43');
    }
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
    
    ctx.fillStyle = '#fff';
    stars.forEach(star => {
        ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.05 + star.x) * 0.2;
        ctx.fillRect(star.x, star.y, star.size, star.size);
        star.x -= star.speed;
        if (star.x < 0) star.x = W;
    });
    ctx.globalAlpha = 1;
    
    clouds.forEach(cloud => {
        ctx.fillStyle = `rgba(255, 255, 255, ${cloud.opacity})`;
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.size, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.size * 0.7, cloud.y - cloud.size * 0.2, cloud.size * 0.8, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.size * 1.4, cloud.y, cloud.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
        cloud.x -= cloud.speed;
        if (cloud.x + cloud.size * 2 < 0) {
            cloud.x = W + 50;
            cloud.y = Math.random() * H * 0.7;
        }
    });
}

function drawHUD() {
    const hpBarW = 200;
    ctx.fillStyle = '#333';
    ctx.fillRect(18, 18, hpBarW + 4, 24);
    ctx.fillStyle = player.hp > 30 ? '#4CAF50' : '#F44336';
    ctx.fillRect(20, 20, hpBarW * Math.max(0, player.hp / player.maxHp), 20);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(18, 18, hpBarW + 4, 24);
    
    ctx.fillStyle = '#fff';
    ctx.font = '16px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText('VIDAS: ' + '♥'.repeat(Math.max(0, player.lives)), 20, 60);
    
    ctx.textAlign = 'right';
    ctx.font = 'bold 20px Courier New';
    ctx.fillText('SCORE: ' + score, W - 20, 35);
    
    ctx.textAlign = 'left';
    ctx.font = '16px Courier New';
    ctx.fillText('BOMBAS [K]: ' + '●'.repeat(Math.max(0, bombs)), 20, 85);
    
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px Courier New';
    if (isBossLevel) {
        ctx.fillStyle = '#F44336';
        ctx.fillText('⚠ FASE ' + level + ' - BOSS ⚠', W/2, H - 20);
    } else {
        ctx.fillStyle = '#fff';
        ctx.fillText(`FASE ${level} - ${levelProgress}/${levelGoal}`, W/2, H - 20);
        
        const progW = 200;
        ctx.fillStyle = '#333';
        ctx.fillRect(W/2 - progW/2, H - 45, progW, 8);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(W/2 - progW/2, H - 45, progW * Math.min(1, levelProgress/levelGoal), 8);
    }
    
    let py = 110;
    ctx.textAlign = 'left';
    ctx.font = '14px Courier New';
    if (player.rapidFire > 0) {
        ctx.fillStyle = '#FFC107';
        ctx.fillText(`TIRO RAPIDO: ${Math.ceil(player.rapidFire/60)}s`, 20, py);
        py += 20;
    }
    if (player.tripleShot > 0) {
        ctx.fillStyle = '#9C27B0';
        ctx.fillText(`TIRO TRIPLO: ${Math.ceil(player.tripleShot/60)}s`, 20, py);
        py += 20;
    }
    if (player.shield > 0) {
        ctx.fillStyle = '#00BCD4';
        ctx.fillText(`ESCUDO: ${Math.ceil(player.shield/60)}s`, 20, py);
    }
}

function drawMenu() {
    drawBackground();
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 60px Courier New';
    ctx.fillText('SKY STRIKER', W/2, 150);
    
    ctx.fillStyle = '#00BCD4';
    ctx.font = '20px Courier New';
    ctx.fillText('✈ MISSAO: Destrua os inimigos e sobreviva! ✈', W/2, 210);
    
    ctx.fillStyle = '#fff';
    ctx.font = '18px Courier New';
    const instructions = [
        '',
        '← ↑ ↓ → ou WASD - Mover',
        'ESPACO ou J - Atirar',
        'K ou SHIFT - Bomba (limpa a tela)',
        '',
        'Colete power-ups: + Vida | >> Tiro Rapido',
        '/// Tiro Triplo | O Escudo | * Bomba',
        '',
        'A cada 3 fases, enfrente um BOSS!'
    ];
    instructions.forEach((line, i) => {
        ctx.fillText(line, W/2, 270 + i * 28);
    });
    
    if (highScore > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.fillText('RECORDE: ' + highScore, W/2, 520);
    }
    
    ctx.fillStyle = Math.floor(frameCount / 30) % 2 === 0 ? '#4CAF50' : '#2E7D32';
    ctx.font = 'bold 24px Courier New';
    ctx.fillText('PRESSIONE ESPACO PARA COMECAR', W/2, 560);
}

function drawLevelClear() {
    drawBackground();
    
    particles.forEach(p => { p.update(); p.draw(); });
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#4CAF50';
    ctx.font = 'bold 50px Courier New';
    ctx.fillText('FASE ' + level + ' COMPLETA!', W/2, 220);
    
    ctx.fillStyle = '#FFD700';
    ctx.font = '28px Courier New';
    ctx.fillText('BONUS: +' + (1000 * level), W/2, 280);
    ctx.fillText('SCORE: ' + score, W/2, 320);
    
    const nextIsBoss = ((level + 1) % 3 === 0);
    ctx.fillStyle = nextIsBoss ? '#F44336' : '#fff';
    ctx.font = '22px Courier New';
    ctx.fillText(
        nextIsBoss ? '⚠ PROXIMA: BATALHA DE BOSS ⚠' : 'PROXIMA FASE AGUARDA...',
        W/2, 380
    );
    
    ctx.fillStyle = Math.floor(frameCount / 30) % 2 === 0 ? '#00BCD4' : '#0097A7';
    ctx.font = 'bold 22px Courier New';
    ctx.fillText('PRESSIONE ESPACO PARA CONTINUAR', W/2, 450);
}

function drawGameOver() {
    drawBackground();
    particles.forEach(p => { p.update(); p.draw(); });
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, W, H);
    
    ctx.textAlign = 'center';
    ctx.fillStyle = '#F44336';
    ctx.font = 'bold 60px Courier New';
    ctx.fillText('GAME OVER', W/2, 200);
    
    ctx.fillStyle = '#fff';
    ctx.font = '26px Courier New';
    ctx.fillText('FASE ALCANCADA: ' + level, W/2, 280);
    ctx.fillText('SCORE FINAL: ' + score, W/2, 320);
    
    if (score >= highScore && score > 0) {
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 24px Courier New';
        ctx.fillText('★ NOVO RECORDE! ★', W/2, 370);
    } else {
        ctx.fillStyle = '#999';
        ctx.font = '20px Courier New';
        ctx.fillText('RECORDE: ' + highScore, W/2, 370);
    }
    
    ctx.fillStyle = Math.floor(frameCount / 30) % 2 === 0 ? '#4CAF50' : '#2E7D32';
    ctx.font = 'bold 24px Courier New';
    ctx.fillText('PRESSIONE ESPACO PARA JOGAR NOVAMENTE', W/2, 450);
}

// ============ GAME LOOP ============
function update() {
    spawnEnemy();
    player.update();
    
    playerBullets.forEach(b => b.update());
    enemyBullets.forEach(b => b.update());
    playerBullets = playerBullets.filter(b => b.active);
    enemyBullets = enemyBullets.filter(b => b.active);
    
    enemies.forEach(e => e.update());
    enemies = enemies.filter(e => e.active);
    
    if (boss && boss.active) {
        boss.update();
    }
    
    powerups.forEach(p => p.update());
    powerups = powerups.filter(p => p.active);
    
    particles.forEach(p => p.update());
    particles = particles.filter(p => p.life > 0);
    
    floatingTexts.forEach(ft => {
        ft.y -= 1;
        ft.life--;
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);
    
    checkCollisions();
}

function draw() {
    drawBackground();
    
    powerups.forEach(p => p.draw());
    enemies.forEach(e => e.draw());
    if (boss && boss.active) boss.draw();
    playerBullets.forEach(b => b.draw());
    enemyBullets.forEach(b => b.draw());
    player.draw();
    particles.forEach(p => p.draw());
    
    floatingTexts.forEach(ft => {
        ctx.globalAlpha = ft.life / 60;
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 16px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1;
    });
    
    drawHUD();
}

function gameLoop() {
    frameCount++;
    
    ctx.save();
    if (screenShake > 0) {
        screenShake--;
        ctx.translate(
            (Math.random() - 0.5) * screenShake,
            (Math.random() - 0.5) * screenShake
        );
    }
    
    switch(gameState) {
        case STATE.MENU:
            drawMenu();
            break;
        case STATE.PLAYING:
            update();
            draw();
            break;
        case STATE.LEVEL_CLEAR:
            drawLevelClear();
            break;
        case STATE.GAME_OVER:
            drawGameOver();
            break;
    }
    
    ctx.restore();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
