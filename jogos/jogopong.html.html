<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pong Clássico</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin: 10px; letter-spacing: 4px; }
  canvas {
    background: #000;
    border: 4px solid #fff;
    box-shadow: 0 0 20px #fff;
  }
  .info { margin-top: 12px; font-size: 14px; opacity: 0.8; text-align: center; }
</style>
</head>
<body>
  <h1>PONG CLÁSSICO</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <div class="info">
    J1: W / S &nbsp;|&nbsp; J2: ↑ / ↓ &nbsp;|&nbsp; ESPAÇO: pausa &nbsp;|&nbsp; M: modo (2P / IA)
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Estado do jogo
let paused = false;
let vsAI = false;
let score1 = 0;
let score2 = 0;
const WIN_SCORE = 10;
let gameOver = false;
let winner = '';

// Paddles
const paddleW = 12;
const paddleH = 90;
const paddleSpeed = 6;

const p1 = { x: 20, y: H/2 - paddleH/2, w: paddleW, h: paddleH, dy: 0 };
const p2 = { x: W - 20 - paddleW, y: H/2 - paddleH/2, w: paddleW, h: paddleH, dy: 0 };

// Bola
const ball = { x: W/2, y: H/2, r: 10, vx: 5, vy: 3, speed: 5 };

// Teclas
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (gameOver) resetGame();
    else paused = !paused;
  }
  if (e.key === 'm' || e.key === 'M') {
    vsAI = !vsAI;
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
  ball.x = W/2;
  ball.y = H/2;
  ball.speed = 5;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45° a 45°
  ball.vx = direction * Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed;
}

function resetGame() {
  score1 = 0;
  score2 = 0;
  gameOver = false;
  winner = '';
  p1.y = H/2 - paddleH/2;
  p2.y = H/2 - paddleH/2;
  resetBall();
}

function updatePaddles() {
  // Jogador 1
  if (keys['w'] || keys['W']) p1.dy = -paddleSpeed;
  else if (keys['s'] || keys['S']) p1.dy = paddleSpeed;
  else p1.dy = 0;

  // Jogador 2 (ou IA)
  if (vsAI) {
    const center = p2.y + p2.h/2;
    const diff = ball.y - center;
    const aiSpeed = 4.5;
    if (Math.abs(diff) > 8) p2.dy = Math.sign(diff) * aiSpeed;
    else p2.dy = 0;
  } else {
    if (keys['ArrowUp']) p2.dy = -paddleSpeed;
    else if (keys['ArrowDown']) p2.dy = paddleSpeed;
    else p2.dy = 0;
  }

  p1.y += p1.dy;
  p2.y += p2.dy;

  p1.y = Math.max(0, Math.min(H - p1.h, p1.y));
  p2.y = Math.max(0, Math.min(H - p2.h, p2.y));
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Rebote no topo/fundo
  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.vy *= -1;
  }
  if (ball.y + ball.r > H) {
    ball.y = H - ball.r;
    ball.vy *= -1;
  }

  // Colisão com paddle 1
  if (ball.x - ball.r < p1.x + p1.w &&
      ball.x + ball.r > p1.x &&
      ball.y > p1.y && ball.y < p1.y + p1.h &&
      ball.vx < 0) {
    const hit = (ball.y - (p1.y + p1.h/2)) / (p1.h/2); // -1 a 1
    const angle = hit * (Math.PI/4); // até 45°
    ball.speed = Math.min(ball.speed + 0.3, 12);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.x = p1.x + p1.w + ball.r;
  }

  // Colisão com paddle 2
  if (ball.x + ball.r > p2.x &&
      ball.x - ball.r < p2.x + p2.w &&
      ball.y > p2.y && ball.y < p2.y + p2.h &&
      ball.vx > 0) {
    const hit = (ball.y - (p2.y + p2.h/2)) / (p2.h/2);
    const angle = hit * (Math.PI/4);
    ball.speed = Math.min(ball.speed + 0.3, 12);
    ball.vx = -Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.x = p2.x - ball.r;
  }

  // Pontos
  if (ball.x < -ball.r) {
    score2++;
    checkWin();
    if (!gameOver) resetBall(1);
  }
  if (ball.x > W + ball.r) {
    score1++;
    checkWin();
    if (!gameOver) resetBall(-1);
  }
}

function checkWin() {
  if (score1 >= WIN_SCORE) {
    gameOver = true;
    winner = 'JOGADOR 1 VENCEU!';
  } else if (score2 >= WIN_SCORE) {
    gameOver = true;
    winner = vsAI ? 'A IA VENCEU!' : 'JOGADOR 2 VENCEU!';
  }
}

function draw() {
  // Fundo
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Linha central tracejada
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Placar
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 60px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(score1, W/2 - 80, 70);
  ctx.fillText(score2, W/2 + 80, 70);

  // Paddles
  ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

  // Bola
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();

  // Mensagens
  ctx.font = 'bold 20px Courier New';
  if (paused && !gameOver) {
    ctx.fillText('PAUSADO', W/2, H/2);
  }
  if (gameOver) {
    ctx.font = 'bold 40px Courier New';
    ctx.fillText(winner, W/2, H/2 - 10);
    ctx.font = 'bold 18px Courier New';
    ctx.fillText('Pressione ESPAÇO para jogar novamente', W/2, H/2 + 30);
  }
  if (vsAI) {
    ctx.font = '14px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('MODO: vs IA', W - 15, H - 15);
  } else {
    ctx.font = '14px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('MODO: 2 JOGADORES', W - 15, H - 15);
  }
}

function loop() {
  if (!paused && !gameOver) {
    updatePaddles();
    updateBall();
  }
  draw();
  requestAnimationFrame(loop);
}

resetBall();
loop();
</script>
</body>
</html>
