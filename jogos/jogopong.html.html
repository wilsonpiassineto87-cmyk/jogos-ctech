<!DOCTYPE html>
<html lang="pt-BR">
<head>
<style id="tc-overflow-guard">html,body{max-width:100vw;overflow-x:hidden}</style>

<style id="tc-canvas-fit">canvas{max-width:100vw;max-height:78vh;height:auto;display:block;margin:0 auto}</style>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta charset="UTF-8">
<title>Pong Clássico</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin: 10px; letter-spacing: 4px; }
  canvas {
    background: #000;
    border: 4px solid #fff;
    box-shadow: 0 0 20px #fff;
  }
  .info { margin-top: 12px; font-size: 14px; opacity: 0.8; text-align: center; }
</style>
</head>
<body>
  <h1>PONG CLÁSSICO</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <div class="info">
    J1: W / S &nbsp;|&nbsp; J2: ↑ / ↓ &nbsp;|&nbsp; ESPAÇO: pausa &nbsp;|&nbsp; M: modo (2P / IA)
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// Estado do jogo
let paused = false;
let vsAI = false;
let score1 = 0;
let score2 = 0;
const WIN_SCORE = 10;
let gameOver = false;
let winner = '';

// Paddles
const paddleW = 12;
const paddleH = 90;
const paddleSpeed = 6;

const p1 = { x: 20, y: H/2 - paddleH/2, w: paddleW, h: paddleH, dy: 0 };
const p2 = { x: W - 20 - paddleW, y: H/2 - paddleH/2, w: paddleW, h: paddleH, dy: 0 };

// Bola
const ball = { x: W/2, y: H/2, r: 10, vx: 5, vy: 3, speed: 5 };

// Teclas
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ') {
    e.preventDefault();
    if (gameOver) resetGame();
    else paused = !paused;
  }
  if (e.key === 'm' || e.key === 'M') {
    vsAI = !vsAI;
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
  ball.x = W/2;
  ball.y = H/2;
  ball.speed = 5;
  const angle = (Math.random() * 0.5 - 0.25) * Math.PI; // -45° a 45°
  ball.vx = direction * Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed;
}

function resetGame() {
  score1 = 0;
  score2 = 0;
  gameOver = false;
  winner = '';
  p1.y = H/2 - paddleH/2;
  p2.y = H/2 - paddleH/2;
  resetBall();
}

function updatePaddles() {
  // Jogador 1
  if (keys['w'] || keys['W']) p1.dy = -paddleSpeed;
  else if (keys['s'] || keys['S']) p1.dy = paddleSpeed;
  else p1.dy = 0;

  // Jogador 2 (ou IA)
  if (vsAI) {
    const center = p2.y + p2.h/2;
    const diff = ball.y - center;
    const aiSpeed = 4.5;
    if (Math.abs(diff) > 8) p2.dy = Math.sign(diff) * aiSpeed;
    else p2.dy = 0;
  } else {
    if (keys['ArrowUp']) p2.dy = -paddleSpeed;
    else if (keys['ArrowDown']) p2.dy = paddleSpeed;
    else p2.dy = 0;
  }

  p1.y += p1.dy;
  p2.y += p2.dy;

  p1.y = Math.max(0, Math.min(H - p1.h, p1.y));
  p2.y = Math.max(0, Math.min(H - p2.h, p2.y));
}

function updateBall() {
  ball.x += ball.vx;
  ball.y += ball.vy;

  // Rebote no topo/fundo
  if (ball.y - ball.r < 0) {
    ball.y = ball.r;
    ball.vy *= -1;
  }
  if (ball.y + ball.r > H) {
    ball.y = H - ball.r;
    ball.vy *= -1;
  }

  // Colisão com paddle 1
  if (ball.x - ball.r < p1.x + p1.w &&
      ball.x + ball.r > p1.x &&
      ball.y > p1.y && ball.y < p1.y + p1.h &&
      ball.vx < 0) {
    const hit = (ball.y - (p1.y + p1.h/2)) / (p1.h/2); // -1 a 1
    const angle = hit * (Math.PI/4); // até 45°
    ball.speed = Math.min(ball.speed + 0.3, 12);
    ball.vx = Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.x = p1.x + p1.w + ball.r;
  }

  // Colisão com paddle 2
  if (ball.x + ball.r > p2.x &&
      ball.x - ball.r < p2.x + p2.w &&
      ball.y > p2.y && ball.y < p2.y + p2.h &&
      ball.vx > 0) {
    const hit = (ball.y - (p2.y + p2.h/2)) / (p2.h/2);
    const angle = hit * (Math.PI/4);
    ball.speed = Math.min(ball.speed + 0.3, 12);
    ball.vx = -Math.cos(angle) * ball.speed;
    ball.vy = Math.sin(angle) * ball.speed;
    ball.x = p2.x - ball.r;
  }

  // Pontos
  if (ball.x < -ball.r) {
    score2++;
    checkWin();
    if (!gameOver) resetBall(1);
  }
  if (ball.x > W + ball.r) {
    score1++;
    checkWin();
    if (!gameOver) resetBall(-1);
  }
}

function checkWin() {
  if (score1 >= WIN_SCORE) {
    gameOver = true;
    winner = 'JOGADOR 1 VENCEU!';
  } else if (score2 >= WIN_SCORE) {
    gameOver = true;
    winner = vsAI ? 'A IA VENCEU!' : 'JOGADOR 2 VENCEU!';
  }
}

function draw() {
  // Fundo
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  // Linha central tracejada
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // Placar
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 60px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(score1, W/2 - 80, 70);
  ctx.fillText(score2, W/2 + 80, 70);

  // Paddles
  ctx.fillRect(p1.x, p1.y, p1.w, p1.h);
  ctx.fillRect(p2.x, p2.y, p2.w, p2.h);

  // Bola
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();

  // Mensagens
  ctx.font = 'bold 20px Courier New';
  if (paused && !gameOver) {
    ctx.fillText('PAUSADO', W/2, H/2);
  }
  if (gameOver) {
    ctx.font = 'bold 40px Courier New';
    ctx.fillText(winner, W/2, H/2 - 10);
    ctx.font = 'bold 18px Courier New';
    ctx.fillText('Pressione ESPAÇO para jogar novamente', W/2, H/2 + 30);
  }
  if (vsAI) {
    ctx.font = '14px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('MODO: vs IA', W - 15, H - 15);
  } else {
    ctx.font = '14px Courier New';
    ctx.textAlign = 'right';
    ctx.fillText('MODO: 2 JOGADORES', W - 15, H - 15);
  }
}

function loop() {
  if (!paused && !gameOver) {
    updatePaddles();
    updateBall();
  }
  draw();
  requestAnimationFrame(loop);
}

resetBall();
loop();
</script>

<style id="tc-style">
#tc-ov{position:fixed;left:0;right:0;bottom:0;z-index:999999;display:none;justify-content:space-between;align-items:flex-end;padding:14px;pointer-events:none;font-family:Arial,Helvetica,sans-serif}
@media (pointer:coarse){#tc-ov{display:flex}}
#tc-ov .tc-pad{position:relative;width:150px;height:150px;pointer-events:auto;flex-shrink:0}
#tc-ov .tc-pad button{position:absolute;width:50px;height:50px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);border-radius:12px;color:#fff;font-size:20px;line-height:1;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#tc-ov .tc-pad .tc-up{top:0;left:50px}
#tc-ov .tc-pad .tc-down{bottom:0;left:50px}
#tc-ov .tc-pad .tc-left{top:50px;left:0}
#tc-ov .tc-pad .tc-right{top:50px;right:0}
#tc-ov .tc-actions{display:flex;gap:10px;pointer-events:auto;align-items:flex-end;flex-shrink:0}
#tc-ov .tc-actions button{min-width:56px;height:56px;padding:0 10px;border-radius:28px;background:rgba(0,180,255,.22);border:2px solid rgba(0,180,255,.6);color:#fff;font-weight:700;font-size:11px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>

<div id="tc-ov"></div>
<script id="tc-script">
(function(){
  var DPAD=[{'dir': 'up', 'code': 'KeyW', 'key': 'w'}, {'dir': 'down', 'code': 'KeyS', 'key': 's'}];
  var ACTS=[];
  var ov=document.getElementById('tc-ov');
  var glyph={up:'\u25B2',down:'\u25BC',left:'\u25C0',right:'\u25B6'};
  function fire(type,code,key){
    var ev=new KeyboardEvent(type,{code:code,key:key,bubbles:true,cancelable:true});
    window.dispatchEvent(ev); document.dispatchEvent(ev);
  }
  function bind(btn,code,key){
    var isDown=false;
    var down=function(e){ if(isDown)return; isDown=true; e.preventDefault(); fire('keydown',code,key); };
    var up=function(e){ if(!isDown)return; isDown=false; e.preventDefault(); fire('keyup',code,key); };
    btn.addEventListener('pointerdown',down);
    btn.addEventListener('pointerup',up);
    btn.addEventListener('pointercancel',up);
    btn.addEventListener('pointerleave',up);
    btn.addEventListener('touchstart',down,{passive:false});
    btn.addEventListener('touchend',up,{passive:false});
    btn.addEventListener('touchcancel',up,{passive:false});
    btn.addEventListener('mousedown',down);
    btn.addEventListener('mouseup',up);
    btn.addEventListener('mouseleave',up);
    btn.addEventListener('contextmenu',function(e){e.preventDefault();});
  }
  if(DPAD.length){
    var pad=document.createElement('div'); pad.className='tc-pad';
    DPAD.forEach(function(d){
      var b=document.createElement('button'); b.className='tc-'+d.dir; b.textContent=glyph[d.dir];
      bind(b,d.code,d.key); pad.appendChild(b);
    });
    ov.appendChild(pad);
  }
  if(ACTS.length){
    var act=document.createElement('div'); act.className='tc-actions';
    ACTS.forEach(function(a){
      var b=document.createElement('button'); b.textContent=a.label;
      bind(b,a.code,a.key); act.appendChild(b);
    });
    ov.appendChild(act);
  }
})();
</script>
</body>
</html>
